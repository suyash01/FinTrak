# Enforces the pull request title convention documented in CONTRIBUTING.md:
# `<ticket-id>: <short description>`, for example
# `FIN-7: read ISO 20022 and OFX bank files in the browser`.
#
# It is a separate workflow rather than a job in docker-publish.yml because that
# pipeline is about release safety, while this is about a contribution's metadata.
# It is deliberately not part of the `validate` gate: a badly-titled pull request
# must not be able to block a release.
#
# Nothing is checked out and no script from the pull request is executed - the
# title comes from the event payload, so an untrusted branch is never run. That is
# also why this listens on `pull_request` rather than `pull_request_target`.
name: Pull Request Title

on:
  pull_request:
    # `edited` catches a title fixed after review; `synchronize` keeps the status
    # fresh on the head commit, which is what a required status check expects.
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  title:
    name: 'Title is "<ticket-id>: <short description>"'
    # Dependabot has no ticket to reference, so its generated titles are exempt.
    # A job skipped by this condition reports as successful, which keeps a bot's
    # pull request from stalling on a rule it cannot satisfy.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check the title against the convention
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          # A ticket key in caps (FIN-7), a number, then ": " and a description.
          pattern='^[A-Z][A-Z0-9]*-[0-9]+: \S.*$'
          limit=100

          if ! [[ "$TITLE" =~ $pattern ]]; then
            echo "::error title=PR title must be <ticket-id>: <short description>"
            echo "  got:      '$TITLE'"
            echo "  expected: 'FIN-7: read ISO 20022 and OFX bank files in the browser'"
            echo "  note:     no scope parentheses here - that is the commit subject's job."
            exit 1
          fi

          if (( ${#TITLE} > limit )); then
            echo "::error title=PR title is ${#TITLE} characters; the limit is $limit"
            exit 1
          fi

          echo "Title matches the convention."
