name: Build and Publish Docker Images

on:
  push:
    branches: ["master"]
    tags: ["v*.*.*"]
    paths-ignore:
      - "*.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "*.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY_GHCR: ghcr.io
  DOCKER_IMAGE_BACKEND: fintrak-backend
  DOCKER_IMAGE_FRONTEND: fintrak-frontend
  DOCKER_IMAGE_PARSER: fintrak-statement-parser

jobs:
  test-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache-dependency-path: backend/go.sum
      - name: Verify go.mod is tidy
        run: |
          cd backend
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: Run go vet
        run: |
          cd backend
          go vet ./...
      - name: Run tests
        run: |
          cd backend
          go test -v -covermode=atomic -coverprofile=coverage.out ./...
      - name: Enforce coverage floor
        run: |
          cd backend
          go run ./cmd/covercheck -profile coverage.out -min 85
      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/coverage.out
          if-no-files-found: ignore
      - name: Upload backend coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: ./backend/coverage.out
          flags: backend
          fail_ci_if_error: false

  test-backend-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache-dependency-path: backend/go.sum
      - name: Run integration tests
        # Boots a throwaway PostgreSQL via testcontainers (Docker is available on
        # GitHub-hosted runners); catches SQL the pgxmock unit tests cannot.
        run: |
          cd backend
          go test -tags=integration -count=1 ./...

  test-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned to the version baked into frontend/Dockerfile so CI and the
          # published image build with the same toolchain.
          bun-version: "1.4.2"
      - name: Install dependencies
        run: |
          cd frontend
          bun install --frozen-lockfile
      - name: Typecheck
        run: |
          cd frontend
          bun run typecheck
      - name: Run tests
        run: |
          cd frontend
          bun run test:coverage
      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: ignore
      - name: Upload frontend coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: ./frontend/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false

  test-parser:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.13"
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: "statement_parser/uv.lock"
      - name: Verify uv.lock is up to date
        run: |
          cd statement_parser
          uv lock --check
      - name: Run tests
        run: |
          cd statement_parser
          uv run --frozen coverage run --source=statement_parser -m unittest discover -s tests -v
          # The same 90% the Codecov flag reports, enforced here so a coverage
          # regression fails the build instead of only colouring a dashboard.
          uv run --frozen coverage report --fail-under=90
          uv run --frozen coverage xml -o coverage.xml
      - name: Upload parser coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: parser-coverage
          path: statement_parser/coverage.xml
          if-no-files-found: ignore
      - name: Upload parser coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: ./statement_parser/coverage.xml
          flags: parser
          fail_ci_if_error: false

  test-tui:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache-dependency-path: tui/go.sum
      - name: Verify go.mod is tidy
        run: |
          cd tui
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: Run go vet
        run: |
          cd tui
          go vet ./...
      - name: Run tests
        run: |
          cd tui
          go test -covermode=atomic -coverprofile=coverage.out ./...
      - name: Enforce coverage floor
        run: |
          cd backend
          go run ./cmd/covercheck -profile ../tui/coverage.out -min 18 -root ../tui
      - name: Upload tui coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tui-coverage
          path: tui/coverage.out
          if-no-files-found: ignore
      - name: Upload tui coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: ./tui/coverage.out
          flags: tui
          fail_ci_if_error: false

  # The shared Go client (`client/`) and the MCP server (`mcp/`) are their own
  # modules with their own floors, exactly like the TUI: the backend's aggregate
  # gate covers `backend/ ./...` only, and `cmd/covercheck` exempts `main.go`.
  test-client:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache-dependency-path: client/go.sum
      - name: Verify go.mod is tidy
        run: |
          cd client
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: Run go vet
        run: |
          cd client
          go vet ./...
      - name: Run tests
        run: |
          cd client
          go test -covermode=atomic -coverprofile=coverage.out ./...
      - name: Enforce coverage floor
        run: |
          cd backend
          go run ./cmd/covercheck -profile ../client/coverage.out -min 85 -root ../client
      - name: Upload client coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: client-coverage
          path: client/coverage.out
          if-no-files-found: ignore
      - name: Upload client coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: ./client/coverage.out
          flags: client
          fail_ci_if_error: false

  test-mcp:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache-dependency-path: mcp/go.sum
      - name: Verify go.mod is tidy
        run: |
          cd mcp
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: Run go vet
        run: |
          cd mcp
          go vet ./...
      - name: Run tests
        run: |
          cd mcp
          go test -covermode=atomic -coverprofile=coverage.out ./...
      - name: Enforce coverage floor
        run: |
          cd backend
          go run ./cmd/covercheck -profile ../mcp/coverage.out -min 80 -root ../mcp
      - name: Upload mcp coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mcp-coverage
          path: mcp/coverage.out
          if-no-files-found: ignore
      - name: Upload mcp coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: ./mcp/coverage.out
          flags: mcp
          fail_ci_if_error: false

  # Single aggregate validation gate. Every publish job depends on this so a
  # tagged release can never push one component's image while another
  # component's tests (or the backend integration suite) are still red.
  validate:
    needs: [test-backend, test-backend-integration, test-frontend, test-parser, test-tui, test-client, test-mcp]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any validation job did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "A required validation job did not succeed; refusing to publish."
          exit 1

  # Smoke-build every Dockerfile on PRs and branch pushes so the images are
  # actually exercised before a release tag (tag pushes run the publish jobs
  # instead, which build and push). amd64 only to keep the PR path fast.
  build-images:
    if: "!startsWith(github.ref, 'refs/tags/v')"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
            file: ./backend/Dockerfile
          - name: frontend
            context: ./frontend
            file: ./frontend/Dockerfile
          - name: statement-parser
            context: ./statement_parser
            file: ./statement_parser/Dockerfile
          - name: tui
            # Root context: the TUI module replaces the shared client module
            # with a path (../client), so the build needs both directories.
            context: .
            file: ./tui/Dockerfile
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          platforms: linux/amd64
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # On tags, build every publishable image for every architecture WITHOUT
  # pushing, before any publish job runs. This is the atomicity gate the
  # test-only `validate` job cannot provide: a Dockerfile/build failure (e.g. a
  # frontend `bun run build` error or an arm64-only break) blocks the whole
  # release instead of letting the other images push under the same v-tag.
  build-release-images:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
            file: ./backend/Dockerfile
          - name: frontend
            context: ./frontend
            file: ./frontend/Dockerfile
          - name: statement-parser
            context: ./statement_parser
            file: ./statement_parser/Dockerfile
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build ${{ matrix.name }} image (all architectures)
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  publish-backend:
    # Gated on the full validation aggregate and the multi-arch build gate, so
    # a failing test or a broken image build blocks every image atomically.
    needs: [validate, build-release-images]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log into GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.REGISTRY_GHCR }}/${{ github.repository_owner }}/${{ env.DOCKER_IMAGE_BACKEND }}
          tags: |
            type=raw,value=latest
            # {{raw}} keeps the tag exactly as pushed (v1.2.3). {{version}}
            # strips the "v", which would publish 1.2.3 while the release notes,
            # .env.example and the prod compose files all deploy v1.2.3.
            type=semver,pattern={{raw}}
            type=sha,prefix=,format=short

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  publish-frontend:
    needs: [validate, build-release-images]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log into GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.REGISTRY_GHCR }}/${{ github.repository_owner }}/${{ env.DOCKER_IMAGE_FRONTEND }}
          tags: |
            type=raw,value=latest
            # {{raw}} keeps the tag exactly as pushed (v1.2.3). {{version}}
            # strips the "v", which would publish 1.2.3 while the release notes,
            # .env.example and the prod compose files all deploy v1.2.3.
            type=semver,pattern={{raw}}
            type=sha,prefix=,format=short

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  publish-parser:
    needs: [validate, build-release-images]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log into GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.REGISTRY_GHCR }}/${{ github.repository_owner }}/${{ env.DOCKER_IMAGE_PARSER }}
          tags: |
            type=raw,value=latest
            # {{raw}} keeps the tag exactly as pushed (v1.2.3). {{version}}
            # strips the "v", which would publish 1.2.3 while the release notes,
            # .env.example and the prod compose files all deploy v1.2.3.
            type=semver,pattern={{raw}}
            type=sha,prefix=,format=short

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./statement_parser
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=statement-parser
          cache-to: type=gha,mode=max,scope=statement-parser

  create-release:
    needs: [publish-backend, publish-frontend, publish-parser]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          body: |
            ## Docker Images
            - Backend: `docker pull ghcr.io/${{ github.repository_owner }}/fintrak-backend:${{ github.ref_name }}`
            - Frontend: `docker pull ghcr.io/${{ github.repository_owner }}/fintrak-frontend:${{ github.ref_name }}`
            - Statement Parser: `docker pull ghcr.io/${{ github.repository_owner }}/fintrak-statement-parser:${{ github.ref_name }}`
