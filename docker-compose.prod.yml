# Production Deployment (with Database)
# Usage: docker compose -f docker-compose.prod.yml up -d
#
# Required environment variables (set in .env or export):
#   POSTGRES_DB       - Database name
#   POSTGRES_USER     - Database user
#   POSTGRES_PASSWORD - Database password
#   DATABASE_URL      - Full connection string (e.g. postgres://user:pass@db:5432/dbname?sslmode=disable)
#   JWT_SECRET        - Secret used to sign auth tokens (set a long random value)

services:
  db:
    container_name: postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - backend-net

  backend:
    container_name: backend
    image: suyash01/fintrak-backend:latest
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:8080/health" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - backend-net
      - frontend-net

  frontend:
    container_name: frontend
    image: suyash01/fintrak-frontend:latest
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - frontend-net

networks:
  backend-net:
  frontend-net:

volumes:
  pgdata:
