# Production Deployment (with bundled PostgreSQL database)
# Usage: docker compose -f docker-compose.prod.yml up -d
#
# Extends docker-compose.prod-no-db.yml and adds a managed database service.
#
# Same Compose project (`fintrak-prod`) as the no-db file, and a different one
# from the dev stack (`fintrak`): the named volume here is
# `fintrak-prod_pgdata`, so running `make prod` on a machine that has run
# `make dev` starts a fresh database instead of adopting the dev volume (and a
# distinct project also means two stacks can be up at once without a container
# name collision). `make prod-down` stops this project either way.
#
# Required environment variables (set in .env or export):
#   POSTGRES_DB       - Database name
#   POSTGRES_USER     - Database user
#   POSTGRES_PASSWORD - Database password
#   DATABASE_URL      - Full connection string (e.g. postgres://user:pass@db:5432/dbname?sslmode=disable)
#   JWT_SECRET        - Secret used to sign auth tokens (set a long random value)
#   TOKEN_ENCRYPTION_KEY - Key used to encrypt Paperless tokens at rest (required
#                       when APP_ENV=production; backend refuses to start without it)
#
# Optional:
#   ALLOWED_ORIGINS - Comma-separated list of allowed CORS origins
#                     (default: http://localhost:3000,http://127.0.0.1:3000)
#   ADMIN_EMAILS    - Comma-separated admin email allowlist. While empty, no
#                     email is reserved as an admin identity.
#   ADMIN_SETUP_TOKEN - Shared secret letting an admin-listed email self-register
#                     with the 'admin' role. Empty disables admin self-registration
#                     entirely.
#   LOG_LEVEL       - debug|info|warn|error (default: info in production)
#   COOKIE_SECURE   - Mark the session cookie Secure (default: true). Set false
#                     only for plain-HTTP deployments with no TLS terminator.
#   IMAGE_REPO      - Registry prefix (required; e.g. ghcr.io/your-org)
#   IMAGE_TAG       - Released image tag to deploy (required; e.g. v1.2.3).
#                     There is intentionally no "latest" default: pinning a
#                     release keeps redeploys reproducible and rollbacks
#                     deterministic.

# `fintrak`), so the two can never share a container name or a database
# volume. See the header note in docker-compose.prod.yml.
name: fintrak-prod

services:
  # Internal only: never publish Postgres to the host in production.
  db:
    # Pinned to the same exact patch release as the dev file. The app images are
    # pinned to a release tag on purpose (see the IMAGE_TAG note above), and the
    # component that owns the data must not be exempt: a floating `18-alpine`
    # alias would let `docker compose pull` move a production database to a new
    # PostgreSQL build — possibly a new minor, which rewrites the data directory
    # on first start — with no application change and no rollback story. Bumps
    # are proposed by the docker-compose entry in .github/dependabot.yml.
    image: postgres:18.6-alpine3.24
    environment:
      # Required, like the backend's secrets: `${VAR}` alone would silently
      # create the database with an empty name/user/password.
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set (database name)}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set (database user)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set to a long random value}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    mem_limit: 1g
    cpus: 1.0
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    networks:
      - app-net

  backend:
    extends:
      file: docker-compose.prod-no-db.yml
      service: backend
    depends_on:
      db:
        condition: service_healthy

  frontend:
    extends:
      file: docker-compose.prod-no-db.yml
      service: frontend

  statement-parser:
    extends:
      file: docker-compose.prod-no-db.yml
      service: statement-parser

networks:
  # Pinned so the frontend's static address (FRONTEND_IP, default 172.28.0.2 —
  # the default TRUSTED_PROXIES value) always falls inside the network the
  # backend sees its proxy on. Override APP_SUBNET and FRONTEND_IP together.
  app-net:
    ipam:
      config:
        - subnet: ${APP_SUBNET:-172.28.0.0/24}

volumes:
  pgdata:
