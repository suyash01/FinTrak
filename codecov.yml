# Codecov configuration.
# Backend, frontend, statement parser, shared Go client, TUI, and MCP server
# upload separately with flags so each part of the monorepo reports its own
# coverage. carryforward keeps
# the last known coverage when a job uploads nothing for a commit (e.g. a
# backend-only PR).
coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
      backend:
        target: 85%
        threshold: 1%
        flags:
          - backend
      frontend:
        target: 75%
        threshold: 1%
        flags:
          - frontend
      parser:
        target: 90%
        threshold: 1%
        flags:
          - parser
      tui:
        # The render-heavy screens in internal/ui are barely covered, so the
        # floor sits just above the current baseline. It reads lower than it did
        # when the shared API client lived in this module (25.25% -> 19.77%):
        # the client moved to `client/` and carries its own 85% flag now, so this
        # number measures the terminal client alone. Ratchet it up as screen
        # tests land; the enforced gate is `make test-tui-cover-check`, which
        # passes `-min 18` to cmd/covercheck (the same number the CI job uses),
        # so this target must stay equal to that flag.
        target: 18%
        threshold: 1%
        flags:
          - tui
      client:
        # The shared API client is a library; `make test-client-cover-check`
        # enforces the same 85% floor.
        target: 85%
        threshold: 1%
        flags:
          - client
      mcp:
        # The MCP server's floors are enforced locally by
        # `make test-mcp-cover-check` at the same numbers.
        target: 80%
        threshold: 1%
        flags:
          - mcp
    patch:
      default:
        target: auto
        threshold: 1%

# Process bootstrap (main()) is exercised only by launching the real binary, not
# by unit tests; the local covercheck gate excludes the same region.
ignore:
  - "backend/main.go"

comment:
  layout: "reach,diff,flags,tree"
  behavior: default
  require_changes: true

flags:
  backend:
    paths:
      - backend/
    carryforward: true
  frontend:
    paths:
      - frontend/
    carryforward: true
  parser:
    paths:
      - statement_parser/
    carryforward: true
  tui:
    paths:
      - tui/
    carryforward: true
  client:
    paths:
      - client/
    carryforward: true
  mcp:
    paths:
      - mcp/
    carryforward: true
