# Codecov configuration.
# Backend, frontend, statement parser, and TUI client upload separately with
# flags so each part of the monorepo reports its own coverage. carryforward keeps
# the last known coverage when a job uploads nothing for a commit (e.g. a
# backend-only PR).
coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
      backend:
        target: 85%
        threshold: 1%
        flags:
          - backend
      frontend:
        target: 75%
        threshold: 1%
        flags:
          - frontend
      parser:
        target: 90%
        threshold: 1%
        flags:
          - parser
      tui:
        # The render-heavy screens in internal/ui are barely covered, so the
        # floor sits just above the current baseline. Ratchet it up as screen
        # tests land; `make test-tui-cover-check` enforces the same number.
        target: 21%
        threshold: 1%
        flags:
          - tui
    patch:
      default:
        target: auto
        threshold: 1%

# Process bootstrap (main()) is exercised only by launching the real binary, not
# by unit tests; the local covercheck gate excludes the same region.
ignore:
  - "backend/main.go"

comment:
  layout: "reach,diff,flags,tree"
  behavior: default
  require_changes: true

flags:
  backend:
    paths:
      - backend/
    carryforward: true
  frontend:
    paths:
      - frontend/
    carryforward: true
  parser:
    paths:
      - statement_parser/
    carryforward: true
  tui:
    paths:
      - tui/
    carryforward: true
