# Local Development
# Usage: docker compose up -d

services:
  db:
    container_name: postgres
    image: postgres:18-alpine3.24
    environment:
      POSTGRES_DB: fintrak
      POSTGRES_USER: fintrak
      POSTGRES_PASSWORD: fintrak
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fintrak"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - backend-net

  statement-parser:
    container_name: statement-parser
    build:
      context: ./statement_parser
    ports:
      - "5000:5000"
    restart: unless-stopped
    networks:
      - backend-net

  backend:
    container_name: backend
    build:
      context: ./backend
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgres://fintrak:fintrak@db:5432/fintrak?sslmode=disable
      - ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173
      - JWT_SECRET=dev-only-secret-change-me
      - STATEMENT_PARSER_URL=http://statement-parser:5000
    depends_on:
      db:
        condition: service_healthy
      statement-parser:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - backend-net
      - frontend-net

  frontend:
    container_name: frontend
    build:
      context: ./frontend
    ports:
      - "3000:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - frontend-net

  adminer:
    container_name: adminer
    image: adminer:6.0.1
    ports:
      - "8081:8080"
    depends_on:
      - db
    networks:
      - backend-net

  dozzle:
    container_name: dozzle
    image: amir20/dozzle:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - dozzle_data:/data
    ports:
      - 8082:8080

networks:
  backend-net:
  frontend-net:

volumes:
  pgdata:
  dozzle_data:
