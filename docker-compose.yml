# Local Development
# Usage: docker compose up -d
#
# Every published port is bound to 127.0.0.1 on purpose. Only :3000 (the
# frontend, which proxies /api/v1 to the backend) and :8080 (the backend, for
# curl/tests) are meant to be reached from the host; the rest — Postgres,
# adminer, pgAdmin and the unauthenticated statement parser — are developer
# conveniences and must not be reachable from another host on a shared network.
#
# Distinct project name and volumes: the dev stack can never share a container
# name or a `pgdata` volume with the production stacks (docker-compose.prod*.yml
# use `fintrak-prod`), so `make prod` on a machine that has run `make dev` starts
# its own database instead of reusing the dev one.
name: fintrak
#
# The optional log viewer (dozzle) mounts the Docker socket, so it is behind
# the "debug" profile and is not started by default:
#   docker compose --profile debug up -d
#
# The terminal client's SSH door is also opt-in (it exposes an extra port and
# accepts logins, so it should be started deliberately):
#   docker compose --profile tui up -d
#   ssh -p 2222 localhost

services:
  db:
    container_name: postgres
    # Pinned patch release (not the floating `18-alpine3.24` alias) so a rebuild
    # never silently moves the dev database to a new minor.
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: fintrak
      POSTGRES_USER: fintrak
      POSTGRES_PASSWORD: fintrak
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fintrak"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - backend-net

  statement-parser:
    container_name: statement-parser
    build:
      context: ./statement_parser
    ports:
      - "127.0.0.1:5000:5000"
    restart: unless-stopped
    networks:
      - backend-net

  backend:
    container_name: backend
    build:
      context: ./backend
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - DATABASE_URL=postgres://fintrak:fintrak@db:5432/fintrak?sslmode=disable
      - ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173
      - JWT_SECRET=dev-only-secret-change-me
      # The dev stack opts in explicitly: unset APP_ENV now means production.
      - APP_ENV=development
      - STATEMENT_PARSER_URL=http://statement-parser:5000
    depends_on:
      db:
        condition: service_healthy
      statement-parser:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - backend-net
      - frontend-net

  frontend:
    container_name: frontend
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:3000:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - frontend-net

  adminer:
    container_name: adminer
    image: adminer:6.0.1
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      - db
    networks:
      - backend-net

  # Dev-only login-less database UI on published default credentials; loopback
  # only (see the header). Pin the image so it cannot change contents unread.
  pgadmin:
    image: dpage/pgadmin4:9.18.0
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "127.0.0.1:8082:80"
    depends_on:
      - db
    networks:
      - backend-net

  # Terminal client served over SSH. Opt-in via the "tui" profile: it publishes
  # an extra port and accepts authentication. The host key lives on a volume so
  # it survives restarts (a regenerated key makes clients refuse the host).
  tui:
    container_name: tui
    profiles:
      - tui
    build:
      # The context is the repo root because the TUI module replaces the shared
      # client module with a path (../client); see the root .dockerignore.
      context: .
      dockerfile: tui/Dockerfile
    ports:
      - "127.0.0.1:2222:2222"
    environment:
      - FINTRAK_API_URL=http://backend:8080/api/v1
      - FINTRAK_SSH_AUTH=password
      # - FINTRAK_SSH_AUTHORIZED_KEYS=/home/appuser/.config/fintrak-tui/authorized_keys
    volumes:
      - tui_config:/home/appuser/.config/fintrak-tui
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - backend-net

  # Log viewer. Opt-in (see the header comment): it mounts the Docker socket,
  # which hands the container the whole Docker API — that is the reason this one
  # must be asked for explicitly, so the profile is required. It serves logs
  # without authentication, so the port is loopback-only as well; if you publish
  # it anywhere else, mount a bcrypt users file and set
  # DOZZLE_AUTH_PROVIDER=simple first.
  dozzle:
    container_name: dozzle
    # Pinned release: the debug profile is not started by default, so a floating
    # tag would change contents unnoticed between opt-ins.
    image: amir20/dozzle:v11.1.1-alpine
    profiles:
      - debug
    volumes:
      # `:ro` only stops the container from writing to the mount point on the
      # host filesystem; the Docker API is reached by connecting to the socket,
      # so this is NOT a boundary around Docker (container create/exec remain
      # available). Use a socket proxy such as docker-socket-proxy when a real
      # API boundary is wanted; the profile gate and the loopback bind are the
      # controls actually in place here.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - dozzle_data:/data
    ports:
      - "127.0.0.1:8083:8080"

networks:
  backend-net:
  frontend-net:

volumes:
  pgdata:
  dozzle_data:
  tui_config:
