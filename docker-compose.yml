services:
  db:
    container_name: postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fintrak
      POSTGRES_USER: fintrak
      POSTGRES_PASSWORD: fintrak
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U fintrak" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - backend-net

  backend:
    container_name: backend
    image: suyash01/fintrak-backend:latest
    build:
      context: ./backend
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgres://fintrak:fintrak@db:5432/fintrak?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:8080/health" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - backend-net
      - frontend-net

  frontend:
    container_name: frontend
    image: suyash01/fintrak-frontend:latest
    build:
      context: ./frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - frontend-net

  adminer:
    container_name: adminer
    image: adminer
    ports:
      - "8081:8080"
    depends_on:
      - db
    profiles:
      - dev
    networks:
      - backend-net

networks:
  backend-net:
  frontend-net:

volumes:
  pgdata:
