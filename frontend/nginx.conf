server {
    # Must match EXPOSE/healthcheck/port mapping (unprivileged nginx cannot bind <1024)
    listen 8080;
    server_name _;

    # Default cap. The backup restore and the statement upload raise it
    # per-location below, because their handlers accept more than this.
    client_max_body_size 20m;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers. `always` keeps them on error responses too.
    #
    # nginx does not inherit add_header directives into a location that defines
    # its own add_header, so the block below is repeated in the static-asset
    # regex and in every location that sets a Cache-Control of its own
    # (/index.html, /sw.js, /manifest.webmanifest, /icons/, /favicon.svg).
    # Keep them in sync.
    #
    # CSP notes: script-src 'self' is possible because the theme bootstrap is an
    # external file (public/theme-init.js), not an inline script. style-src
    # allows 'unsafe-inline' for React/Radix inline style attributes. frame-src
    # allows blob: for the in-app Paperless PDF preview iframe.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Reverse proxy API requests to the backend service.
    #
    # Same-origin proxying is the supported topology: the CSP below only allows
    # `connect-src 'self'`, and the session cookie is same-origin. Building the
    # SPA with a cross-origin VITE_API_URL would be blocked by the browser
    # unless this CSP (and the backend CORS allowlist) is updated to include
    # that origin.
    location /api/v1/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # A backup restore bundle is bounded by maxBackupBytes in
    # backend/handlers/backup.go (256 << 20 = 256 MB), which is far above the
    # 20m default: without this override nginx answers 413 with its own HTML
    # page long before ImportUserData can reply "backup file is too large".
    # Must track that constant; an exact-match location takes precedence over
    # the /api/v1/ prefix above.
    location = /api/v1/import {
        client_max_body_size 256m;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Same boundary for the statement upload: ParseStatement caps the body at
    # maxStatementUpload plus 1 MB of multipart envelope in
    # backend/handlers/statement.go, so a maximal PDF exceeds the 20m default.
    # Must track maxStatementUpload + (1 << 20).
    location = /api/v1/statements/parse {
        client_max_body_size 21m;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The theme bootstrap is served unhashed from the image, so it must not be
    # cached immutably like the hashed Vite bundles below. An exact match takes
    # precedence over the regex location; defining no add_header here lets the
    # server-level security headers (including CSP) apply.
    location = /theme-init.js {
        expires -1;
    }

    # The service worker and the manifest are unhashed too, and the regex below
    # would otherwise pin them for a year: a worker that can never be updated
    # strands an installed app on a stale build. Both set a Cache-Control of
    # their own, so unlike theme-init.js (which sets none) nginx stops
    # inheriting the server-level security headers; the block is repeated here
    # verbatim.
    location = /sw.js {
        expires -1;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    location = /manifest.webmanifest {
        expires -1;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # The PWA icons and the favicon are unhashed as well (frontend/public/icons/,
    # referenced by manifest.webmanifest and index.html), so the regex below
    # would pin them immutable for a year and an installed app would keep
    # serving its stale icon from its own caches. `^~` keeps them out of that
    # regex; the header block is repeated for the reason above.
    location ^~ /icons/ {
        expires -1;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    location = /favicon.svg {
        expires -1;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # SPA fallback: route all paths to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # Disable caching for index.html (so new deploys are picked up)
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
}
