server {
    # Must match EXPOSE/healthcheck/port mapping (unprivileged nginx cannot bind <1024)
    listen 8080;
    server_name _;

    # Default cap. The backup restore and the statement upload raise it
    # per-location below, because their handlers accept more than this.
    client_max_body_size 20m;

    root /usr/share/nginx/html;
    index index.html;

    # Compress the text this app is made of. JSON matters most: the ledger reads
    # and the Money Flow payloads are large, and without this they cross the wire
    # uncompressed. `gzip_vary` is what stops a cache from handing compressed
    # bytes to a client that did not ask for them. text/html is not listed
    # because nginx always compresses it and listing it warns about a duplicate.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Security headers, stated once for the whole server and included again in
    # every location that sets a Cache-Control of its own (nginx stops inheriting
    # add_header at that point). See security-headers.conf for why the snippet
    # exists and what the policy assumes.
    include /etc/nginx/snippets/security-headers.conf;

    # Reverse proxy API requests to the backend service.
    #
    # Same-origin proxying is the supported topology: the CSP in the snippet only
    # allows `connect-src 'self'`, and the session cookie is same-origin.
    location /api/v1/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A ledger read is authenticated by a Cookie and is never reusable by
        # anyone else, so nothing between the client and nginx may store it and
        # anything that does has to key on the session rather than the URL. The
        # backend sets no cache headers of its own, so this is where it is said.
        # These two lines stop the location inheriting the server-level block:
        # hence the include.
        add_header Cache-Control "no-store" always;
        add_header Vary "Cookie" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # A backup restore bundle is bounded by maxBackupBytes in
    # backend/handlers/backup.go (256 << 20 = 256 MB), which is far above the
    # 20m default: without this override nginx answers 413 with its own HTML
    # page long before ImportUserData can reply "backup file is too large".
    # Must track that constant; an exact-match location takes precedence over
    # the /api/v1/ prefix above.
    #
    # A restore rewrites the whole ledger in one transaction and the backend's
    # write timeout is 300s (backend/main.go), so the proxy has to outlast it:
    # the 60s default would answer 504 while the restore kept running and
    # committed, and a restore is refused once the account has data, so the user
    # would have no clean retry. The SPA budgets 320s for the same call.
    location = /api/v1/import {
        client_max_body_size 256m;
        proxy_read_timeout 310s;
        proxy_send_timeout 310s;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
        add_header Vary "Cookie" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Same boundary for the statement upload: ParseStatement caps the body at
    # maxStatementUpload plus 1 MB of multipart envelope in
    # backend/handlers/statement.go, so a maximal PDF exceeds the 20m default.
    # Must track maxStatementUpload + (1 << 20).
    #
    # The backend forwards the upload to the parser with its own 60s client
    # timeout, and the whole round trip has to fit inside the proxy's budget or
    # a slow parse is answered with nginx's HTML 504 while the parser is still
    # working. 75s covers that 60s plus the upload and the response; the SPA
    # budgets 90s for the same call.
    location = /api/v1/statements/parse {
        client_max_body_size 21m;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
        add_header Vary "Cookie" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # The theme bootstrap is served unhashed from the image, so it must not be
    # cached immutably like the hashed Vite bundles below. An exact match takes
    # precedence over the regex location; defining no add_header here lets the
    # server-level security headers (including CSP) apply.
    location = /theme-init.js {
        expires -1;
    }

    # The service worker and the manifest are unhashed too, and the regex below
    # would otherwise pin them for a year: a worker that can never be updated
    # strands an installed app on a stale build. Both set a Cache-Control of
    # their own, so unlike theme-init.js (which sets none) nginx stops
    # inheriting the server-level security headers: hence the include.
    location = /sw.js {
        expires -1;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location = /manifest.webmanifest {
        expires -1;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # The PWA icons and the favicon are unhashed as well (frontend/public/icons/,
    # referenced by manifest.webmanifest and index.html), so the regex below
    # would pin them immutable for a year and an installed app would keep
    # serving its stale icon from its own caches. `^~` keeps them out of that
    # regex; the header block is included for the reason above.
    location ^~ /icons/ {
        expires -1;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location = /favicon.svg {
        expires -1;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # SPA fallback: route all paths to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Disable caching for index.html (so new deploys are picked up)
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        include /etc/nginx/snippets/security-headers.conf;
    }
}
