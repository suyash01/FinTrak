# The security headers every response carries, as one included snippet.
#
# nginx does not inherit `add_header` into a location that declares one of its
# own, so the moment a location sets a Cache-Control of its own — the
# static-asset regex, /index.html, /sw.js, /manifest.webmanifest, /icons/,
# /favicon.svg and the proxied API locations — the server-level block stops
# applying to it. `include` states the policy once; before this file existed the
# block was copied into each of those locations with nothing but a comment
# keeping the copies in sync, which is one silent edit away from a route losing
# its CSP or HSTS.
#
# `always` keeps them on error responses too.
#
# CSP notes: script-src 'self' is possible because the theme bootstrap is an
# external file (public/theme-init.js), not an inline script. style-src allows
# 'unsafe-inline' for React/Radix inline style attributes. frame-src allows
# blob: for the in-app Paperless PDF preview iframe. connect-src 'self' is why
# same-origin proxying is the supported topology: building the SPA with a
# cross-origin VITE_API_URL would be blocked by the browser unless this policy
# (and the backend CORS allowlist) is updated to include that origin.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
