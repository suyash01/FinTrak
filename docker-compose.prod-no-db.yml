# Production Deployment (external/existing database)
# Usage: docker compose -f docker-compose.prod-no-db.yml up -d
#
# This file defines the core backend + frontend services. It is also the base
# for docker-compose.prod.yml, which extends it with a bundled PostgreSQL
# database service.
#
# Required environment variables (set in .env or export):
#   DATABASE_URL - Full connection string to an external database
#   JWT_SECRET   - Secret used to sign auth tokens (set a long random value)
#
# Optional:
#   ALLOWED_ORIGINS - Comma-separated list of allowed CORS origins
#                     (default: http://localhost:3000,http://127.0.0.1:3000)
#   IMAGE_REPO      - Registry prefix (default: ghcr.io/suyash01)
#   IMAGE_TAG       - Image tag to deploy (default: latest). Pin to a released
#                     version (e.g. v1.2.3) for reproducible deployments.

services:
  backend:
    container_name: backend
    image: ${IMAGE_REPO:-ghcr.io/suyash01}/fintrak-backend:${IMAGE_TAG:-latest}
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      - JWT_SECRET=${JWT_SECRET}
      - APP_ENV=production
      - STATEMENT_PARSER_URL=http://statement-parser:5000
    depends_on:
      statement-parser:
        condition: service_started
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:8080/health" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - app-net

  frontend:
    container_name: frontend
    image: ${IMAGE_REPO:-ghcr.io/suyash01}/fintrak-frontend:${IMAGE_TAG:-latest}
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-net

  statement-parser:
    container_name: statement-parser
    image: ${IMAGE_REPO:-ghcr.io/suyash01}/fintrak-statement-parser:${IMAGE_TAG:-latest}
    ports:
      - "5000:5000"
    restart: unless-stopped
    networks:
      - app-net

networks:
  app-net:
