<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Statement Transaction Extractor</title>
    <style>
      :root {
        --ink: #1c2321;
        --paper: #fafaf8;
        --line: #dfded8;
        --accent: #2a6f4f;
        --accent-dark: #1e5138;
        --debit: #b3441e;
        --credit: #2a6f4f;
        --muted: #6b6f6d;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family:
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
        background: var(--paper);
        color: var(--ink);
      }
      header {
        padding: 2.25rem 1.5rem 1.25rem;
        max-width: 780px;
        margin: 0 auto;
      }
      header h1 {
        font-size: 1.5rem;
        margin: 0 0 0.35rem;
        letter-spacing: -0.01em;
      }
      header p {
        color: var(--muted);
        margin: 0;
        font-size: 0.95rem;
      }
      main {
        max-width: 780px;
        margin: 0 auto;
        padding: 0 1.5rem 3rem;
      }
      .card {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 1.5rem;
        margin-bottom: 1.5rem;
      }
      .row {
        display: flex;
        gap: 0.75rem;
        flex-wrap: wrap;
        align-items: flex-end;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
      }
      .field label {
        font-size: 0.8rem;
        font-weight: 600;
        color: var(--muted);
      }
      input[type="file"],
      input[type="password"] {
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 0.5rem 0.6rem;
        font-size: 0.9rem;
        background: var(--paper);
      }
      input[type="password"] {
        width: 220px;
      }
      button {
        background: var(--accent);
        color: #fff;
        border: none;
        border-radius: 6px;
        padding: 0.6rem 1.2rem;
        font-size: 0.9rem;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.15s ease;
      }
      button:hover {
        background: var(--accent-dark);
      }
      button:disabled {
        background: #b7bdb9;
        cursor: not-allowed;
      }
      button.secondary {
        background: transparent;
        color: var(--accent-dark);
        border: 1px solid var(--accent);
        font-weight: 600;
      }
      button.secondary:hover {
        background: #eef4f0;
      }
      .status {
        font-size: 0.88rem;
        margin-top: 0.75rem;
      }
      .status.error {
        color: var(--debit);
      }
      .status.info {
        color: var(--muted);
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.88rem;
      }
      th,
      td {
        text-align: left;
        padding: 0.55rem 0.6rem;
        border-bottom: 1px solid var(--line);
      }
      th {
        color: var(--muted);
        font-weight: 600;
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.03em;
      }
      td.amount {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .tag {
        display: inline-block;
        padding: 0.1rem 0.5rem;
        border-radius: 999px;
        font-size: 0.72rem;
        font-weight: 600;
      }
      .tag.Debit {
        background: #fbe9e2;
        color: var(--debit);
      }
      .tag.Credit {
        background: #e4f1ea;
        color: var(--credit);
      }
      .summary-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 0.75rem;
        margin-bottom: 1rem;
      }
      .summary-grid div {
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 0.6rem 0.75rem;
      }
      .summary-grid .label {
        font-size: 0.72rem;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.03em;
      }
      .summary-grid .value {
        font-size: 1.05rem;
        font-weight: 600;
        margin-top: 0.15rem;
      }
      .toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 0.75rem;
        gap: 0.75rem;
        flex-wrap: wrap;
      }
      .toolbar .actions {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
      }
      .hidden {
        display: none;
      }
      footer {
        text-align: center;
        color: var(--muted);
        font-size: 0.8rem;
        padding-bottom: 2rem;
      }
      code {
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 0.1rem 0.35rem;
        font-size: 0.85em;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Statement Transaction Extractor</h1>
      <p>
        Upload a credit card statement PDF to pull out the transaction table.
        Password-protected PDFs are supported.
      </p>
    </header>

    <main>
      <div class="card">
        <form id="uploadForm">
          <div class="row">
            <div class="field">
              <label for="fileInput">Statement PDF</label>
              <input
                type="file"
                id="fileInput"
                accept="application/pdf"
                required
              />
            </div>
            <div class="field">
              <label for="passwordInput">Password (if protected)</label>
              <input
                type="password"
                id="passwordInput"
                placeholder="optional"
              />
            </div>
            <div class="field">
              <label for="extractorSelect">Extractor</label>
              <select id="extractorSelect"></select>
            </div>
            <button type="submit" id="submitBtn">Extract transactions</button>
          </div>
          <div id="status" class="status"></div>
        </form>
      </div>

      <div class="card hidden" id="resultsCard">
        <div class="summary-grid" id="summaryGrid"></div>
        <div class="toolbar">
          <strong id="txnCount"></strong>
          <div class="actions">
            <button class="secondary" id="downloadCsvBtn">Download CSV</button>
          </div>
        </div>
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Description</th>
              <th>Type</th>
              <th style="text-align: right">Amount (₹)</th>
            </tr>
          </thead>
          <tbody id="txnBody"></tbody>
        </table>
      </div>
    </main>

    <footer>
      REST API available at
      <code>POST /api/extract</code>
      (multipart form:
      <code>file</code>
      , optional
      <code>password</code>
      ; add
      <code>?format=csv</code>
      for a CSV response).
    </footer>

    <script>
      const form = document.getElementById("uploadForm");
      const statusEl = document.getElementById("status");
      const submitBtn = document.getElementById("submitBtn");
      const resultsCard = document.getElementById("resultsCard");
      const txnBody = document.getElementById("txnBody");
      const txnCount = document.getElementById("txnCount");
      const summaryGrid = document.getElementById("summaryGrid");
      const downloadCsvBtn = document.getElementById("downloadCsvBtn");
      const extractorSelect = document.getElementById("extractorSelect");

      let lastFile = null;
      let lastPassword = null;
      let lastExtractor = "sbi_cc";

      function buildExtractFormData() {
        const fd = new FormData();
        if (!lastFile) return fd;
        fd.append("file", lastFile);
        if (lastPassword) fd.append("password", lastPassword);
        return fd;
      }

      async function loadExtractors() {
        try {
          const res = await fetch("/api/extractors");
          const data = await res.json();
          const extractors = data.extractors || [];
          extractorSelect.innerHTML = "";
          extractors.forEach((ex) => {
            const option = document.createElement("option");
            option.value = ex.name;
            option.textContent = ex.display_name || ex.name;
            extractorSelect.appendChild(option);
          });
          if (!extractors.some((ex) => ex.name === lastExtractor)) {
            lastExtractor = (extractors[0] && extractors[0].name) || "sbi_cc";
          }
          extractorSelect.value = lastExtractor;
        } catch (err) {
          extractorSelect.innerHTML = '<option value="sbi_cc">sbi_cc</option>';
        }
      }

      function setStatus(msg, kind) {
        statusEl.textContent = msg;
        statusEl.className = "status" + (kind ? " " + kind : "");
      }

      function renderSummary(summary) {
        summaryGrid.innerHTML = "";
        const labels = {
          total_amount_due: "Total Amount Due",
          minimum_amount_due: "Minimum Amount Due",
          statement_date: "Statement Date",
          payment_due_date: "Payment Due Date",
          credit_limit: "Credit Limit",
          available_credit_limit: "Available Credit Limit",
        };
        Object.entries(summary).forEach(([key, value]) => {
          if (!labels[key]) return;
          const div = document.createElement("div");
          div.innerHTML = `<div class="label">${labels[key]}</div><div class="value">${value}</div>`;
          summaryGrid.appendChild(div);
        });
      }

      function renderTransactions(txns) {
        txnBody.innerHTML = "";
        txns.forEach((t) => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
      <td>${t.date}</td>
      <td>${t.description}</td>
      <td><span class="tag ${t.type}">${t.type}</span></td>
      <td class="amount">${t.amount.toLocaleString("en-IN", { minimumFractionDigits: 2 })}</td>
    `;
          txnBody.appendChild(tr);
        });
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const fileInput = document.getElementById("fileInput");
        const passwordInput = document.getElementById("passwordInput");
        if (!fileInput.files.length) return;

        lastFile = fileInput.files[0];
        lastPassword = passwordInput.value;
        lastExtractor = extractorSelect.value || "sbi_cc";

        submitBtn.disabled = true;
        setStatus("Reading PDF…", "info");
        resultsCard.classList.add("hidden");

        const fd = buildExtractFormData();

        try {
          const res = await fetch(
            `/api/extract?extractor=${encodeURIComponent(lastExtractor)}`,
            { method: "POST", body: fd },
          );
          const data = await res.json();

          if (!res.ok) {
            setStatus(data.error || "Something went wrong.", "error");
            submitBtn.disabled = false;
            return;
          }

          setStatus("", "");
          txnCount.textContent = `${data.transaction_count} transaction${data.transaction_count === 1 ? "" : "s"} found`;
          renderSummary(data.summary || {});
          renderTransactions(data.transactions || []);
          resultsCard.classList.remove("hidden");
        } catch (err) {
          setStatus("Could not reach the server. Please try again.", "error");
        } finally {
          submitBtn.disabled = false;
        }
      });

      loadExtractors();

      downloadCsvBtn.addEventListener("click", async () => {
        if (!lastFile) return;
        const fd = buildExtractFormData();

        const res = await fetch(
          `/api/extract?format=csv&extractor=${encodeURIComponent(lastExtractor)}`,
          {
            method: "POST",
            body: fd,
          },
        );
        if (!res.ok) {
          setStatus("Could not generate CSV.", "error");
          return;
        }
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "transactions.csv";
        a.click();
        URL.revokeObjectURL(url);
      });
    </script>
  </body>
</html>
