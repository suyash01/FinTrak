          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /links/transfer-suggestions:
    get:
      tags:
        - Links
      summary: Get transfer link suggestions
      description: Get suggested transfers between accounts based on matching amounts
      operationId: getTransferSuggestions
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          description: Page size (max 100).
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Paginated list of suggested transfers
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/TransferSuggestion"
                  page:
                    type: integer
                  limit:
                    type: integer
                  hasMore:
                    type: boolean
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /links/cycles:
    get:
      tags:
        - Links
      summary: Get the circular-money report
      description: >-
        Report the account-to-account link flows the Money Flow Sankey cannot
        draw. The graph has to stay acyclic, so reciprocal pairs are netted and
        the DFS back edges that close a longer loop are dropped; this endpoint
        returns exactly those discarded cycles (kind `reciprocal` for a
        two-account loop, `cycle` for a longer one) with their participants, the
        gross flow of each leg, and the amount that actually circulates the
        whole loop. It also lists the directed account flows with no flow in the
        opposite direction — a legitimately one-way bill payment or refund looks
        the same as a half-entered transfer, which is why they are surfaced for
        review rather than corrected. Leg amounts are gross flows within the
        window (before netting).
      operationId: getLinkCycles
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: dateFrom
          schema:
            type: string
            format: date
          description: Filter from date (YYYY-MM-DD)
        - in: query
          name: dateTo
          schema:
            type: string
            format: date
          description: Filter to date (YYYY-MM-DD)
        - in: query
          name: accountId
          schema:
            type: string
            format: uuid
          description: Only links with either endpoint on this account
      responses:
        "200":
          description: Circular-money report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkCycleReport"
        "400":
          description: Invalid accountId
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /links/cashback-suggestions:
    get:
      tags:
        - Links
      summary: Get cashback link suggestions
      description: Get suggested cashback links based on matching amounts
      operationId: getCashbackSuggestions
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          description: Page size (max 100).
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Paginated list of suggested cashbacks
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/TransferSuggestion"
                  page:
                    type: integer
                  limit:
                    type: integer
                  hasMore:
                    type: boolean
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # ============= Recurring Series =============
  # A recurring series is a user-defined expectation of a repeating charge or
  # income. FinTrak only forecasts the schedule and suggests matching
  # transactions; it never auto-creates transactions from a series and never
  # auto-links transactions to it. Linking is explicit via /recurring/attach.
  /recurring:
    get:
      tags:
        - Recurring
      summary: List recurring series
      operationId: getRecurringSeries
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Recurring series with derived next-due date and monthly amount
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/RecurringSeries"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

    post:
      tags:
        - Recurring
      summary: Create a recurring series
      operationId: createRecurringSeries
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRecurringSeriesRequest"
      responses:
        "201":
          description: Recurring series created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecurringSeries"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /recurring/{id}:
    put:
      tags:
        - Recurring
      summary: Update a recurring series
      operationId: updateRecurringSeries
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRecurringSeriesRequest"
      responses:
        "200":
          description: Recurring series updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecurringSeries"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

    delete:
      tags:
        - Recurring
      summary: Delete a recurring series
      operationId: deleteRecurringSeries
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Recurring series deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /recurring/{id}/forecast:
    get:
      tags:
        - Recurring
      summary: Forecast the next occurrences of a series
      operationId: getRecurringForecast
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - name: count
          in: query
          required: false
          description: Number of upcoming occurrences to project (max 60).
          schema:
            type: integer
            minimum: 1
            maximum: 60
            default: 12
      responses:
        "200":
          description: Projected occurrences
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/RecurringForecastItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /recurring/{id}/suggestions:
    get:
      tags:
        - Recurring
      summary: Suggest transactions that may satisfy a series
      description: |
        Returns existing transactions that may satisfy a series' occurrences,
        highest score first. Every range is considered (not just the most recent
        transactions): a candidate must fall inside a range and match its account
        and amount, and be near an expected occurrence. Read-only — nothing is
        linked.
      operationId: getRecurringSuggestions
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          description: Page size (max 500).
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: Scored candidate transactions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/RecurringSuggestion"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /recurring/{id}/transactions:
    get:
      tags:
        - Recurring
      summary: List transactions attached to a series
      operationId: getRecurringTransactions
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Attached transactions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Transaction"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /recurring/{id}/terms:
    get:
      tags:
        - Recurring
      summary: List a series' date-ranged amount/account entries
      operationId: getRecurringTerms
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Terms, oldest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/RecurringSeriesTerm"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

    put:
      tags:
        - Recurring
      summary: Record a date-ranged amount/account entry
      description: |
        Adds a term with an explicit [start, end) range (the end is exclusive and
        optional). Its range must not overlap an existing entry of the same
        series. Forecast and suggestions use the entry covering each
        occurrence/transaction date.
      operationId: createRecurringTerm
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRecurringSeriesTermRequest"
      responses:
        "201":
          description: Term created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecurringSeriesTerm"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /recurring/{id}/terms/{termId}:
    put:
      tags:
        - Recurring
      summary: Edit a series term
      description: |
        Updates a term's date range, amount, or account. The edited range must
        not overlap another entry of the same series.
      operationId: updateRecurringTerm
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: termId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRecurringSeriesTermRequest"
      responses:
        "200":
          description: Term updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecurringSeriesTerm"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

    delete:
      tags:
        - Recurring
      summary: Delete a series term
      description: |
        Removes a date range. Any term may be removed; deleting one leaves a gap
        that matches no transaction until it is replaced.
      operationId: deleteRecurringTerm
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: termId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Term deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /recurring/attach:
    post:
      tags:
        - Recurring
      summary: Link transactions to a recurring series
      operationId: attachRecurring
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecurringAttachRequest"
      responses:
        "200":
          description: Transactions linked
          content:
            application/json:
              schema:
                type: object
                properties:
                  attached:
                    type: integer
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: One or more transactions are already linked to a recurring series
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /recurring/detach:
    post:
      tags:
        - Recurring
      summary: Unlink transactions from their recurring series
      operationId: detachRecurring
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecurringDetachRequest"
      responses:
        "200":
          description: Transactions unlinked
          content:
            application/json:
              schema:
                type: object
                properties:
                  detached:
                    type: integer
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # ============= Statement Parsing =============
  /statements/parse:
    post:
      tags:
        - Statements
      summary: Parse a bank statement PDF
      description: |
        Upload a bank or credit-card statement PDF for automatic extraction.
        The PDF is forwarded to the standalone statement-parser service.
      operationId: parseStatement
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: PDF file to parse
                extractor:
                  type: string
                  description: Extractor name (e.g., "sbi_cc", "icici_cc")
                password:
                  type: string
                  description: PDF password if encrypted
                date_format:
                  type: string
                  description: Date format hint for the parser
              required:
                - file
      responses:
        "200":
          description: Statement parsed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParseStatementResult"
        "400":
          description: Invalid file or parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: |
            The statement could not be parsed: the PDF is password-protected
            (retry with `password`), it has no extractable text (a scanned
            image-only file), or the selected extractor does not match it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: File too large (max 20 MB)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Statement parser service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /statements/extractors:
    get:
      tags:
        - Statements
      summary: List available statement extractors
      description: Get the list of available parsers from the statement-parser service
      operationId: listStatementExtractors
      security:
        - BearerAuth: []
      responses:
        "200":
          description: List of extractors
          content:
            application/json:
              schema:
                type: object
                properties:
                  extractors:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        display_name:
                          type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          description: Statement parser service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # ============= Paperless Integration =============
  /paperless/settings:
    get:
      tags:
        - Paperless
      summary: Get Paperless settings
      description: Retrieve the current user's Paperless-ngx integration configuration
      operationId: getPaperlessSettings
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Settings retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaperlessSettingsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

    put:
      tags:
        - Paperless
      summary: Update Paperless settings
      description: Update Paperless-ngx configuration (URL, API token, tag label, page size)
      operationId: updatePaperlessSettings
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserSettingsRequest"
      responses:
        "200":
          description: Settings updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaperlessSettingsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /paperless/documents:
    get:
      tags:
        - Paperless
      summary: List Paperless documents
      description: >
        Fetch a page of documents from the user's Paperless-ngx instance.
        Filters and pagination are forwarded to Paperless so filtering happens
        server-side. The full correspondent/document-type/tag lookup tables are
        returned so the UI can render filter dropdowns without fetching every
        document.
      operationId: listPaperlessDocuments
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: search
          required: false
          schema:
            type: string
          description: Search over the document title only. Single-word queries are forwarded to Paperless as `title_search`; multi-word queries become a fielded Tantivy query (`title:"word" AND ...`, every word must appear in the title). OCR content is never searched.
        - in: query
          name: page
          required: false
          schema:
            type: integer
            default: 1
            minimum: 1
          description: Page number (1-based)
        - in: query
          name: pageSize
          required: false
          schema:
            type: integer
            default: 25
            minimum: 1
            maximum: 100
          description: Documents per page (Paperless caps this at 100)
        - in: query
          name: correspondentInc
          required: false
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
          description: Correspondent names to include (any match)
        - in: query
          name: correspondentExc
          required: false
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
          description: Correspondent names to exclude
        - in: query
          name: documentTypeInc
          required: false
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
          description: Document type names to include (any match)
        - in: query
          name: documentTypeExc
          required: false
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
          description: Document type names to exclude
        - in: query
          name: tagInc
          required: false
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
          description: Tag names to include (any match)
        - in: query
          name: tagExc
          required: false
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
          description: Tag names to exclude
      responses:
        "200":
          description: Paginated list of documents
          content:
            application/json:
              schema:
                type: object
                properties:
                  documents:
                    type: array
                    items:
                      $ref: "#/components/schemas/PaperlessDocument"
                  page:
                    type: integer
                  pageSize:
                    type: integer
                  totalCount:
                    type: integer
                  totalPages:
                    type: integer
                  correspondents:
                    type: array
                    items:
                      type: string
                  documentTypes:
                    type: array
                    items:
                      type: string
                  tags:
                    type: array
                    items:
                      type: string
        "400":
          description: Paperless is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          description: Paperless or parser service is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /paperless/documents/{id}/file:
    get:
      tags:
        - Paperless
      summary: Download a Paperless document file
      description: Download the original file for a Paperless document
      operationId: getPaperlessDocumentFile
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Paperless document ID
      responses:
        "200":
          description: Document file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          description: Paperless is not configured or invalid document ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Document not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Paperless is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /paperless/import:
    post:
      tags:
        - Paperless
      summary: Import a Paperless document
      description: Download and parse a document from Paperless-ngx for import
      operationId: importPaperlessDocument
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaperlessImportRequest"
      responses:
        "200":
          description: Document parsed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParseStatementResult"
        "400":
          description: Invalid request or Paperless not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: |
            The document could not be parsed: it is password-protected (retry
            with `password`), it has no extractable text, or the selected
            extractor does not match it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Document not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Paperless or parser service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # ============= Dashboard =============
  /dashboard/summary:
    get:
      tags:
        - Dashboard
      summary: Get dashboard summary
      description: Get aggregate financial data with optional date range and account filters
      operationId: getDashboardSummary
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: dateFrom
          schema:
            type: string
            format: date
          description: Filter from date (YYYY-MM-DD)
        - in: query
          name: dateTo
          schema:
            type: string
            format: date
          description: Filter to date (YYYY-MM-DD)
        - in: query
          name: accountId
          schema:
            type: string
            format: uuid
          description: Filter by account ID
        - in: query
          name: groupBy
          schema:
            type: string
            enum:
              - billing_cycle
          description: >-
            When "billing_cycle", frame the whole summary around the statement
            periods of the account given by `accountId` (which must have a
            `billingDay` set). The stat totals and category breakdowns span the
            last `cycles` cycles, `billingCycleTrend` replaces `monthlyTrend`,
            and `currentCycle` describes the in-progress period. Date-range
            filters are ignored in this mode.
        - in: query
          name: cycles
          schema:
            type: integer
            default: 12
          description: Number of billing cycles to include in the window (1-60, used with groupBy=billing_cycle)
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /dashboard/money-flow:
    get:
      tags:
        - Dashboard
      summary: Get money-flow graph
      description: >-
        Aggregate the user's transactions into a left-to-right Sankey graph:
        money sources (income categories) flow into accounts, out into spending
        categories, and on to payees. Cross-account links (transfers, refunds,
        cashbacks, bill payments) are drawn as account-to-account edges after
        netting reciprocal pairs and breaking remaining cycles, so the graph
        stays acyclic; the per-type `linkSummary` is still returned alongside.
        The income, category, and payee stages are each capped at `limit`
        nodes, with the remainder collapsed into an "Other" node.
      operationId: getMoneyFlow
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: dateFrom
          schema:
            type: string
            format: date
          description: Filter from date (YYYY-MM-DD)
        - in: query
          name: dateTo
          schema:
            type: string
            format: date
          description: Filter to date (YYYY-MM-DD)
        - in: query
          name: accountId
          schema:
            type: string
            format: uuid
          description: Filter by account ID
        - in: query
          name: limit
          schema:
            type: integer
            default: 12
            minimum: 1
            maximum: 30
          description: >-
            Maximum number of nodes kept in the income, category, and payee
            stages (1-30); the remainder collapse into an "Other" node. Account
            nodes are never capped.
      responses:
        "200":
          description: Money-flow graph
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MoneyFlowGraph"
        "400":
          description: Invalid accountId
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /dashboard/money-flow/timeline:
    get:
      tags:
        - Dashboard
      summary: Get money-flow timeline
      description: >-
        Per-period income/expense/net totals for the Money Flow page's timeline
        strip. Periods are calendar months by default; with
        `groupBy=billing_cycle` (which requires an account with a `billingDay`)
        they are the account's statement periods for the last `cycles` cycles.
      operationId: getMoneyFlowTimeline
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: dateFrom
          schema:
            type: string
            format: date
          description: Filter from date (YYYY-MM-DD, month grouping)
        - in: query
          name: dateTo
          schema:
            type: string
            format: date
          description: Filter to date (YYYY-MM-DD, month grouping)
        - in: query
          name: accountId
          schema:
            type: string
            format: uuid
          description: Filter by account ID
        - in: query
          name: groupBy
          schema:
            type: string
            enum: [month, billing_cycle]
            default: month
          description: Group periods by calendar month or the account's billing cycles
        - in: query
          name: cycles
          schema:
            type: integer
            default: 12
          description: Number of billing cycles in the window (1-60, with groupBy=billing_cycle)
      responses:
        "200":
          description: Money-flow timeline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MoneyFlowTimeline"
        "400":
          description: Invalid accountId, or billing-cycle view without a billing-day account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Account not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /dashboard/cash-flow-calendar:
    get:
      tags:
        - Dashboard
      summary: Get cash-flow calendar heatmap
      description: >-
        Aggregate the user's transactions by day for a GitHub-style cash-flow
        heatmap: per-day income, expense, and net over an optional date range
        and account filter. Days with no transactions are omitted. When a
        single account is supplied, the response also carries its
        billing-cycle boundaries (`cycles`) and the synthetic summary rows
        already shown in the transactions list (`markers`: month-end running
        balances, or per-cycle total outstanding when the account has a
        billing day) so they can be overlaid on the calendar.
      operationId: getCashFlowCalendar
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: dateFrom
          schema:
            type: string
            format: date
          description: Filter from date (YYYY-MM-DD)
        - in: query
          name: dateTo
          schema:
            type: string
            format: date
          description: Filter to date (YYYY-MM-DD)
        - in: query
          name: accountId
          schema:
            type: string
            format: uuid
          description: >-
            Filter by account ID. When provided, billing-cycle boundaries and
            synthetic summary markers for that account are included.
      responses:
        "200":
          description: Cash-flow calendar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashFlowCalendar"
        "400":
          description: Invalid accountId
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # ============= Backup & Restore =============
  /export:
    get:
      tags:
        - Backup
      summary: Export all user data as a JSON backup
      description: |
        Download a complete, versioned JSON snapshot of everything the
        authenticated user owns: accounts, category groups and categories,
        payees, billing cycles, transactions, links, loan attachments,
        recurring series/terms/attachments, rules, and non-secret settings.
        The Paperless API token and password hash are never included. This is
        the user-level counterpart to `GET /accounts/{id}/export`, which only
        covers one account's transactions as CSV.
      operationId: exportUserData
      security:
        - BearerAuth: []
      responses:
        "200":
          description: JSON backup bundle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupBundle"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /import:
    post:
      tags:
        - Backup
      summary: Restore a JSON backup bundle
      description: |
        Restore a bundle produced by `GET /export`. The restore is applied in a
        single database transaction and is all-or-nothing. It is refused with
        409 when the authenticated user already has accounts, because merging a
        foreign bundle into existing data is ambiguous. Every row is inserted
        with a freshly minted ID and every reference (category, payee, account,
        billing cycle, transaction) is remapped, so a bundle is portable across
        users and instances.
      operationId: importUserData
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BackupBundle"
      responses:
        "200":
          description: Restore summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupImportResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: The target user already has accounts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Backup file too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  schemas:
    # ============= Requests =============
    RegisterRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 12
          description: At least 12 characters and at most 72 bytes (bcrypt's input limit)
        setupToken:
          type: string
          description: |
            Required only when the email is listed in ADMIN_EMAILS: the shared
            ADMIN_SETUP_TOKEN that grants the admin role. Without it such a
            registration is refused, so an unverified registrant can neither
            self-promote nor squat the address.

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6

    CreateAccountRequest:
      type: object
      required:
        - name
        - accountTypeId
      properties:
        name:
          type: string
        accountTypeId:
          type: string
        bank:
          type: string
        currency:
          type: string
          default: INR
        color:
          type: string
          default: "#06b6d4"
        isDefault:
          type: boolean
        billingDay:
          type: integer
          minimum: 1
          maximum: 31
          default: 1
          description: Credit-card billing day on which each billing cycle ends; only meaningful for credit-card accounts (defaults to 1)

    UpdateAccountRequest:
      type: object
      properties:
        name:
          type: string
        accountTypeId:
          type: string
        bank:
          type: string
        currency:
          type: string
        color:
          type: string
        isDefault:
          type: boolean
        closed:
          type: boolean
          description: Marks the account closed (true) or reopens it (false); omitted keeps the current value
        billingDay:
          type: integer
          minimum: 1
          maximum: 31
          description: Credit-card billing day on which each billing cycle ends; omitted keeps the current value

    CreateAccountTypeRequest:
      type: object
      required:
        - id
        - name
        - positiveTxnType
      properties:
        id:
          type: string
          pattern: "^[a-z][a-z0-9_]{1,29}$"
          description: Custom type slug (2-30 chars, starts with a letter, lowercase letters/digits/underscores only)
        name:
          type: string
        positiveTxnType:
          type: string
          enum: [credit, debit]

    UpdateAccountTypeRequest:
      type: object
      properties:
        name:
          type: string
        positiveTxnType:
          type: string
          enum: [credit, debit]

    CreateTransactionRequest:
      type: object
      required:
        - accountId
        - date
        - description
        - amount
        - type
      properties:
        accountId:
          type: string
          format: uuid
        date:
          type: string
          format: date
        description:
          type: string
        amount:
          type: number
          minimum: 0
          exclusiveMinimum: true
        type:
          type: string
          enum: [debit, credit]
        categoryId:
          type: string
          format: uuid
        payeeId:
          type: string
          format: uuid
        tags:
          type: array
          items:
            type: string
        notes:
          type: string
        billingCycleId:
          type: string
          format: uuid
        clientKey:
          type: string
          maxLength: 64
          description: |
            Optional idempotency key. A create repeating a key the user has
            already used returns that transaction (200) instead of inserting a
            second row, so a client may safely retry a create whose response was
            lost — the offline outbox relies on this when it flushes on
            reconnect.

    UpdateTransactionRequest:
      type: object
      properties:
        categoryId:
          type: string
          format: uuid
          nullable: true
        tags:
          type: array
          items:
            type: string
        notes:
          type: string
        payeeId:
          type: string
          format: uuid
          nullable: true
        date:
          type: string
          format: date
        description:
          type: string
        amount:
          type: number
        type:
          type: string
          enum: [debit, credit]
        accountId:
          type: string
          format: uuid
        billingCycleId:
          type: string
          format: uuid
          nullable: true

    ImportTransaction:
      type: object
      required:
        - date
        - description
        - amount
        - type
      properties:
        date:
          type: string
          format: date
        description:
          type: string
        amount:
          type: number
          minimum: 0
          exclusiveMinimum: true
        type:
          type: string
          enum: [debit, credit]
        payeeId:
          type: string
          format: uuid

    ImportRequest:
      type: object
      required:
        - accountId
        - transactions
      properties:
        accountId:
          type: string
          format: uuid
        transactions:
          type: array
          items:
            $ref: "#/components/schemas/ImportTransaction"
        duplicateAction:
          type: string
          enum: [skip, keep]
          default: skip
        billingCycleId:
          type: string
          format: uuid
        paperlessDocumentIds:
          type: array
          items:
            type: integer

    ValidateTransactionsRequest:
      type: object
      required:
        - accountId
        - transactions
      properties:
        accountId:
          type: string
          format: uuid
        transactions:
          type: array
          items:
            $ref: "#/components/schemas/ImportTransaction"

    BulkCategorizeRequest:
      type: object
      required:
        - transactionIds
        - categoryId
      properties:
        transactionIds:
          type: array
          items:
            type: string
            format: uuid
        categoryId:
          type: string
          format: uuid

    BulkUpdatePayeeRequest:
      type: object
      required:
        - transactionIds
        - payeeId
      properties:
        transactionIds:
          type: array
          items:
            type: string
            format: uuid
        payeeId:
          type: string
          format: uuid

    BulkBillingCycleRequest:
      type: object
      required:
        - transactionIds
        - billingCycleId
      properties:
        transactionIds:
          type: array
          items:
            type: string
            format: uuid
        billingCycleId:
          type: string
          format: uuid

    BulkLoanRequest:
      type: object
      required:
        - transactionIds
      properties:
        transactionIds:
          type: array
          items:
            type: string
            format: uuid
        loanAccountId:
          type: string
          format: uuid
          description: Loan / EMI account to attach to. Omit or null to detach.

    LoanSchedule:
      type: object
      properties:
        id:
          type: string
          format: uuid
        loanAccountId:
          type: string
          format: uuid
        principal:
          type: number
          description: The sanctioned principal.
        processingFee:
          type: number
          description: >-
            What the lender charged, recorded for reference: it is never
            amortized, so the table repays the whole principal whatever the fee
            was. A lender that finances its charges has them entered in the
            principal instead.
        annualRateBps:
          type: integer
          description: Annual interest rate in basis points (950 = 9.50% p.a.).
        tenureMonths:
          type: integer
        startDate:
          type: string
          format: date
          description: Due date of the first installment.
        disbursalDate:
          type: string
          format: date
          nullable: true
          description: >-
            When the loan was disbursed. When the period from it to startDate is
            not a whole month, that period is charged its actual days over a
            30-day month and the EMI is solved so the loan still clears in the
            full tenure, so every installment stays level.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    LoanScheduleRequest:
      type: object
      required:
        - principal
        - tenureMonths
        - startDate
      properties:
        principal:
          type: number
          description: Loan principal; must be positive.
        processingFee:
          type: number
          default: 0
          description: >-
            Lender fee recorded for reference; must not be negative. It does not
            affect the EMI or the table, which always amortize the principal.
        annualRateBps:
          type: integer
          default: 0
          description: Annual rate in basis points (950 = 9.50% p.a.). 0 is valid.
        tenureMonths:
          type: integer
          description: Tenure in months (1-600).
        startDate:
          type: string
          format: date
          description: Due date of the first installment (YYYY-MM-DD).
        disbursalDate:
          type: string
          format: date
          description: >-
            Optional disbursal date (YYYY-MM-DD); must be before startDate.
            Empty clears it.

    LoanScheduleEntry:
      type: object
      description: >-
        One installment: the EMI split into principal and interest, and the
        principal still outstanding after it. The split is not uniform: the
        first installment differs when the first period is a broken month, and
        every installment a balance transfer recast carries its own amount.
      properties:
        number:
          type: integer
        dueDate:
          type: string
          format: date
        amount:
          type: number
        principal:
          type: number
        interest:
          type: number
        balance:
          type: number
        paid:
          type: boolean
        transactionId:
          type: string
          format: uuid
          description: The attached EMI payment covering this installment.
        recast:
          type: boolean
          description: >-
            Regenerated by a balance transfer, so its amount differs from the
            installments before it.
        cancelled:
          type: boolean
          description: >-
            Voided because a balance transfer settled the loan. A cancelled
            installment is never paid and is excluded from the totals.

    LoanScheduleDetail:
      type: object
      properties:
        schedule:
          allOf:
            - $ref: "#/components/schemas/LoanSchedule"
          nullable: true
          description: Null until the loan has a schedule.
        loanAccountName:
          type: string
        emi:
          type: number
          description: >-
            The installment in force — after a balance transfer, the recast one.
            It is rounded up to the whole rupee, the way a lender quotes it, and
            the final installment clears what that rounding leaves. Individual
            entries still carry their own amount.
        totalInterest:
          type: number
          description: Interest over the installments that were not cancelled.
        totalPayable:
          type: number
        entries:
          type: array
          items:
            $ref: "#/components/schemas/LoanScheduleEntry"
        transfers:
          type: array
          description: >-
            Balance transfers this loan took part in, in date order — the ones
            it gave its balance away in and the ones it absorbed.
          items:
            $ref: "#/components/schemas/LoanPrincipalTransfer"
        settledOn:
          type: string
          format: date
          nullable: true
          description: >-
            Set when a balance transfer settled this loan: its unpaid
            installments are cancelled and nothing is outstanding.
        disbursement:
          allOf:
            - $ref: "#/components/schemas/LoanDisbursement"
          description: >-
            What the loan released and the bank credit it is reconciled
            against; absent when the loan has no schedule.
        lastPaidDate:
          type: string
          format: date
          nullable: true
          description: >-
            The date of the payment covering the highest covered installment:
            what a settlement's interest accrues from. Absent until an
            installment is paid.
        paidInstallments:
          type: integer
        paidAmount:
          type: number
          description: >-
            Attached EMI debits minus any attached credits — the same figure the
            account list shows as "Repaid".
        principalPaid:
          type: number
        interestPaid:
          type: number
        outstandingPrincipal:
          type: number
          description: >-
            What the borrower still owes, counting transferred-in principal and
            excluding what a settlement cleared.
        nextDueDate:
          type: string
          format: date
          nullable: true
        completed:
          type: boolean

    LoanPrincipalTransfer:
      type: object
      description: >-
        A balance transfer between two loan accounts: the amount the source
        still owed on transferDate moved to the target, which recast its
        remaining installments over it. Deleting the transfer reverts both.
      properties:
        id:
          type: string
          format: uuid
        fromLoanAccountId:
          type: string
          format: uuid
        fromLoanAccountName:
          type: string
        toLoanAccountId:
          type: string
          format: uuid
        toLoanAccountName:
          type: string
        amount:
          type: number
          description: >-
            The payoff that moved: principal plus the interest accrued since the
            source's last EMI payment.
        principal:
          type: number
          description: The part of the amount that was principal.
        accruedInterest:
          type: number
          description: >-
            The part of the amount that was interest accrued since the last EMI
            payment.
        transferDate:
          type: string
          format: date
        mode:
          type: string
          enum: [recast, opens, takeover]
          description: What the transfer did to the target loan.
        createdAt:
          type: string
          format: date-time

    LoanTransferRequest:
      type: object
      required:
        - toLoanAccountId
        - transferDate
      properties:
        toLoanAccountId:
          type: string
          format: uuid
          description: The loan account that takes over the balance.
        transferDate:
          type: string
          format: date
          description: Effective date (YYYY-MM-DD).
        mode:
          type: string
          enum: [recast, opens, takeover]
          description: >-
            What the transfer does to the target. `recast` adds the amount to the
            target's installments still due after the transfer date, so its debt
            grows; `takeover` leaves the target's own table alone and records the
            amount as paid out of its disbursement, so the cash it released is
            smaller; `opens` starts the target's schedule from the amount, for a
            target that has no terms of its own. Absent means `recast` when the
            target has a schedule and `opens` when it has none.
        targetAnnualRateBps:
          type: integer
          nullable: true
          description: >-
            Required only when the target loan has no schedule yet, and ignored
            when it has one.
        targetTenureMonths:
          type: integer
          nullable: true
          description: >-
            Required only when the target loan has no schedule yet, and ignored
            when it has one.
        targetStartDate:
          type: string
          format: date
          description: >-
            First installment date for a target loan that has no schedule yet,
            and ignored when it has one.

    LoanTransferResult:
      type: object
      properties:
        transfer:
          $ref: "#/components/schemas/LoanPrincipalTransfer"
        source:
          allOf:
            - $ref: "#/components/schemas/LoanScheduleDetail"
          description: The settled source loan after the transfer.
        target:
          allOf:
            - $ref: "#/components/schemas/LoanScheduleDetail"
          description: The recast target loan after the transfer.

    DeleteLoanTransferResult:
      type: object
      properties:
        deleted:
          type: integer
          description: 1 when a transfer was removed, 0 when none matched.

    LoanPayoff:
      type: object
      description: >-
        What settling a loan on a date costs: the principal still owed plus the
        interest accrued since the last EMI payment.
      properties:
        loanAccountName:
          type: string
        asOf:
          type: string
          format: date
          description: The date quoted for.
        fromDate:
          type: string
          format: date
          description: The last EMI payment the accrual runs from.
        days:
          type: integer
          description: Days between fromDate and asOf.
        outstandingPrincipal:
          type: number
        accruedInterest:
          type: number
        payoff:
          type: number
          description: outstandingPrincipal + accruedInterest.

    LoanDisbursement:
      type: object
      description: >-
        What a loan actually released, and the bank credit it is reconciled
        against.
      properties:
        sanctioned:
          type: number
          description: The schedule's principal.
        processingFee:
          type: number
        paidOut:
          type: number
          description: Takeovers this loan funded, paid out of its disbursement.
        net:
          type: number
          description: >-
            sanctioned - processingFee - paidOut: the cash the borrower should
            have received.
        creditTransactionId:
          type: string
          format: uuid
          nullable: true
          description: The linked bank credit; absent until one is linked.
        creditAmount:
          type: number
          nullable: true
        verified:
          type: boolean
          description: A credit is linked and its amount equals net.
        difference:
          type: number
          description: >-
            creditAmount - net, so a positive value means more money arrived than
            the schedule implies.

    LoanDisbursementRequest:
      type: object
      required:
        - transactionId
      properties:
        transactionId:
          type: string
          format: uuid
          description: The bank credit that released the loan.

    DeleteLoanDisbursementResult:
      type: object
      properties:
        deleted:
          type: integer
          description: 1 when a link was removed, 0 when none matched.

    BulkDeleteTransactionsRequest:
      type: object
      required:
