  /recurring/{id}/suggestions:
    get:
      tags:
        - Recurring
      summary: Suggest transactions that may satisfy a series
      description: |
        Returns existing transactions that may satisfy a series' occurrences,
        highest score first. Every range is considered (not just the most recent
        transactions): a candidate must fall inside a range and match its account
        and amount, and be near an expected occurrence. Read-only — nothing is
        linked.
      operationId: getRecurringSuggestions
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          description: Page size (max 500).
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: Scored candidate transactions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/RecurringSuggestion"
