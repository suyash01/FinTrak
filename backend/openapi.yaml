    BackupRecurringSeries:
      type: object
      description: |
        A recurring series/subscription template. Its amount, account and date
        range live on its terms (BackupRecurringTerm).
      required: [id, name, type, frequency, interval]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        type:
          type: string
          enum: [debit, credit]
        frequency:
          type: string
          enum: [daily, weekly, monthly, yearly]
        interval:
          type: integer
        categoryId:
          type: string
          format: uuid
          nullable: true
        payeeId:
          type: string
          format: uuid
          nullable: true
        active:
          type: boolean
        notes:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    BackupRecurringTerm:
      type: object
      required: [id, seriesId, startDate, amount, accountId]
      properties:
        id:
          type: string
          format: uuid
        seriesId:
          type: string
          format: uuid
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
          nullable: true
        amount:
          type: number
        accountId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time

    BackupRecurringAttachment:
      type: object
      required: [id, seriesId, transactionId]
      properties:
        id:
          type: string
          format: uuid
        seriesId:
          type: string
          format: uuid
        transactionId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time

    BackupRule:
      type: object
      required: [id, pattern, matchType, categoryId]
      properties:
        id:
          type: string
          format: uuid
        pattern:
          type: string
        matchType:
          type: string
          enum: [contains, starts_with, exact]
        categoryId:
          type: string
          format: uuid
        payeeId:
          type: string
          format: uuid
          nullable: true
        priority:
          type: integer

    BackupImportResult:
      type: object
      properties:
        accounts:
          type: integer
        categoryGroups:
          type: integer
        categories:
          type: integer
        payees:
          type: integer
        billingCycles:
          type: integer
        transactions:
          type: integer
        links:
          type: integer
        loanAttachments:
          type: integer
        recurringSeries:
          type: integer
        recurringTerms:
          type: integer
        recurringAttachments:
          type: integer
        rules:
          type: integer
        warnings:
          type: array
          items:
            type: string

    # ============= Common =============
    ErrorResponse:
      type: object
      required:
        - errors
      properties:
        errors:
          type: array
          minItems: 1
          items:
            type: object
            required:
              - message
            properties:
              field:
                type: string
              tag:
                type: string
              message:
                type: string

    MessageResponse:
      type: object
      properties:
        message:
          type: string

  responses:
    BadRequest:
      description: Bad request (invalid input)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Unauthorized:
      description: Missing or invalid authentication token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Forbidden:
      description: User does not have permission to access this resource
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Optional alternative to the httpOnly session cookie. Use the JWT value
        delivered in the `fintrak_token` cookie by /auth/register or
        /auth/login; the token itself is never returned in a response body.
