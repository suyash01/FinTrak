        month:
          type: string
          format: date
        income:
          type: number
        expense:
          type: number

    CurrentCycleInfo:
      type: object
      properties:
        id:
          type: string
          format: uuid
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        label:
          type: string

    BillingCycleTrendItem:
      type: object
      properties:
        label:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        income:
          type: number
        expense:
          type: number

    DashboardSummary:
      type: object
      properties:
        totalAccounts:
          type: integer
        totalTransactions:
          type: integer
        totalIncome:
          type: number
        totalExpense:
          type: number
        byCategory:
          type: array
          items:
            $ref: "#/components/schemas/CategorySpend"
        incomeByCategory:
          type: array
          items:
            $ref: "#/components/schemas/CategorySpend"
        monthlyTrend:
          type: array
          items:
            $ref: "#/components/schemas/MonthlyData"
        recentTransactions:
          type: array
          items:
            $ref: "#/components/schemas/Transaction"
        currentCycle:
          $ref: "#/components/schemas/CurrentCycleInfo"
        billingCycleTrend:
          type: array
          items:
            $ref: "#/components/schemas/BillingCycleTrendItem"

    MoneyFlowNode:
      type: object
      properties:
        id:
          type: string
          description: >-
            Stable stage-prefixed node id, e.g. `account:<uuid>`,
            `category:uncategorized`, `income:other`.
        name:
          type: string
        kind:
          type: string
          enum: [income, account, category, payee]
        color:
          type: string
          description: Display color (base-group color for categories, account color for accounts)
        group:
          type: string
          description: Category group id for category and income nodes
        total:
          type: number

    MoneyFlowEdge:
      type: object
      properties:
        source:
          type: string
          description: Source node id
        target:
          type: string
          description: Target node id
        value:
          type: number

    MoneyFlowLinkSummary:
      type: object
      properties:
        type:
          type: string
          enum: [transfer, cashback, refund, bill_payment]
        count:
          type: integer
        total:
          type: number

    MoneyFlowGraph:
      type: object
      properties:
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/MoneyFlowNode"
        links:
          type: array
          items:
            $ref: "#/components/schemas/MoneyFlowEdge"
        totalIncome:
          type: number
        totalExpense:
          type: number
        linkSummary:
          type: array
          items:
            $ref: "#/components/schemas/MoneyFlowLinkSummary"

    LinkCycleAccount:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        color:
          type: string

    LinkFlowTypeTotal:
      type: object
      description: Per-link-type rollup of one account-to-account flow.
      properties:
        type:
          type: string
          enum: [transfer, cashback, refund, bill_payment]
        count:
          type: integer
        total:
          type: number

    LinkCycleLeg:
      type: object
      description: >-
        One directed leg of a cycle, running from `fromAccountId` to
        `toAccountId`. `amount` is the gross flow in the window.
      properties:
        fromAccountId:
          type: string
          format: uuid
        fromAccountName:
          type: string
        fromAccountColor:
          type: string
        toAccountId:
          type: string
          format: uuid
        toAccountName:
          type: string
        toAccountColor:
          type: string
        amount:
          type: number
        count:
          type: integer
        types:
          type: array
          items:
            $ref: "#/components/schemas/LinkFlowTypeTotal"

    LinkCycle:
      type: object
      properties:
        kind:
          type: string
          enum: [reciprocal, cycle]
          description: >-
            `reciprocal` for a two-account loop that flows both ways (netted
            into a single Sankey edge), `cycle` for a longer loop broken by
            dropping its back edge.
        accounts:
          type: array
          description: Participants in flow order.
          items:
            $ref: "#/components/schemas/LinkCycleAccount"
        legs:
          type: array
          items:
            $ref: "#/components/schemas/LinkCycleLeg"
        net:
          type: number
          description: >-
            The smallest leg — the amount that actually circulates the whole
            loop.
        gross:
          type: number
          description: Sum of the legs.
        transactions:
          type: integer
          description: Number of links making up the cycle.

    LinkOneSidedFlow:
      type: object
      description: >-
        A directed account-to-account flow with no flow in the opposite
        direction in the window.
      properties:
        fromAccountId:
          type: string
          format: uuid
        fromAccountName:
          type: string
        fromAccountColor:
          type: string
        toAccountId:
          type: string
          format: uuid
        toAccountName:
          type: string
        toAccountColor:
          type: string
        total:
          type: number
        count:
          type: integer
        types:
          type: array
          items:
            $ref: "#/components/schemas/LinkFlowTypeTotal"

    LinkCycleReport:
      type: object
      properties:
        cycles:
          type: array
          items:
            $ref: "#/components/schemas/LinkCycle"
        totalCircular:
          type: number
          description: Sum of every cycle's `net`.
        oneSidedFlows:
          type: array
          items:
            $ref: "#/components/schemas/LinkOneSidedFlow"

    CashFlowCalendarDay:
      type: object
      properties:
        date:
          type: string
          format: date
        income:
          type: number
        expense:
          type: number
        net:
          type: number
        count:
          type: integer

    CashFlowCalendarMarker:
      type: object
      properties:
        date:
          type: string
          format: date
        label:
          type: string
          description: e.g. "Total outstanding" or "Running balance"
        kind:
          type: string
          enum: [balance, outstanding]
        amount:
          type: number

    CashFlowCalendarCycle:
      type: object
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        outstanding:
          type: number

    CashFlowCalendar:
      type: object
      properties:
        days:
          type: array
          items:
            $ref: "#/components/schemas/CashFlowCalendarDay"
        markers:
          type: array
          items:
            $ref: "#/components/schemas/CashFlowCalendarMarker"
        cycles:
          type: array
          items:
            $ref: "#/components/schemas/CashFlowCalendarCycle"
        totalIncome:
          type: number
        totalExpense:
          type: number
        net:
          type: number
        maxAbsNet:
          type: number
          description: Largest absolute daily net in the window, for heatmap scaling.

    MoneyFlowTimelinePeriod:
      type: object
      properties:
        key:
          type: string
          description: Stable period key ("YYYY-MM" for months, the cycle id otherwise)
        label:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        income:
          type: number
        expense:
          type: number
        net:
          type: number

    MoneyFlowTimeline:
      type: object
      properties:
        groupBy:
          type: string
          enum: [month, billing_cycle]
        periods:
          type: array
          items:
            $ref: "#/components/schemas/MoneyFlowTimelinePeriod"

    # ============= Recurring Series =============
    RecurringSeries:
      type: object
      properties:
        id:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
          description: Account of the term in effect today (derived from the series' terms)
        name:
          type: string
        description:
          type: string
        amount:
          type: number
          description: Amount of the term in effect today (derived from the series' terms)
        type:
          type: string
          enum: [debit, credit]
        frequency:
          type: string
          enum: [daily, weekly, monthly, yearly]
        interval:
          type: integer
        startDate:
          type: string
          format: date
          description: Earliest term start (derived from the series' terms)
        endDate:
          type: string
          format: date
          nullable: true
          description: Latest term end (nil while open-ended; derived from the series' terms)
        categoryId:
          type: string
          format: uuid
          nullable: true
        payeeId:
          type: string
          format: uuid
          nullable: true
        active:
          type: boolean
        notes:
          type: string
        createdAt:
          type: string
          format: date-time
        accountName:
          type: string
        categoryName:
          type: string
        categoryIcon:
          type: string
        categoryColor:
          type: string
        payee:
          type: string
        nextDueDate:
          type: string
          format: date
          nullable: true
          description: Next occurrence on/after today (omitted once the series has ended)
        monthlyAmount:
          type: number
          description: Estimated monthly cost (normalized from the frequency and interval)
        attachedCount:
          type: integer

    RecurringForecastItem:
      type: object
      properties:
        date:
          type: string
          format: date
        amount:
          type: number
        type:
          type: string
          enum: [debit, credit]
        matched:
          type: boolean
          description: Whether an attached transaction already falls on (or near) this occurrence

    RecurringSuggestion:
      type: object
      properties:
        txn:
          $ref: "#/components/schemas/Transaction"
        score:
          type: number
        occurrenceDate:
          type: string
          format: date
        daysOff:
          type: number

    RecurringSeriesRange:
      type: object
      description: |
        One account/amount entry with its own date range. The end is exclusive:
        the entry applies from its startDate up to (but not including) endDate.
        Entries must not overlap, but gaps are allowed so a subscription can be
        discontinued and resumed. An omitted endDate is open-ended. The
        subscription's overall start/end are derived from the entries.
      required:
        - startDate
        - amount
        - accountId
      properties:
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
          description: Exclusive range end; omit to keep the entry open-ended
        amount:
          type: number
        accountId:
          type: string
          format: uuid

    CreateRecurringSeriesRequest:
      type: object
      description: |
        Either supply the full `ranges` list (which also derives the
        subscription's start and end), or a single `startDate` + `accountId` +
        `amount`.
      required:
        - name
        - type
        - frequency
      properties:
        accountId:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        amount:
          type: number
        type:
          type: string
          enum: [debit, credit]
        frequency:
          type: string
          enum: [daily, weekly, monthly, yearly]
        interval:
          type: integer
          minimum: 1
          default: 1
        startDate:
          type: string
          format: date
          description: Required unless `ranges` is supplied
        endDate:
          type: string
          format: date
          description: |
            Subscription end for the single-amount form (omit for open-ended).
            When `ranges` is supplied, each entry carries its own end instead.
        categoryId:
          type: string
          format: uuid
          nullable: true
        payeeId:
          type: string
          format: uuid
          nullable: true
        active:
          type: boolean
          default: true
        notes:
          type: string
        ranges:
          type: array
          items:
            $ref: "#/components/schemas/RecurringSeriesRange"

    UpdateRecurringSeriesRequest:
      type: object
      description: |
        Partial update; absent fields are left unchanged. When `ranges` is
        non-empty it replaces the series' whole range list; otherwise an
        `amount`/`accountId` change is recorded as a new range.
      properties:
        accountId:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        amount:
          type: number
        type:
          type: string
          enum: [debit, credit]
        frequency:
          type: string
          enum: [daily, weekly, monthly, yearly]
        interval:
          type: integer
          minimum: 1
        categoryId:
          type: string
          format: uuid
          nullable: true
        payeeId:
          type: string
          format: uuid
          nullable: true
        active:
          type: boolean
        notes:
          type: string
        effectiveDate:
          type: string
          format: date
          description: |
            When an amount/account change starts (default: today). Ignored when
            `ranges` is supplied, or unless the amount or account actually
            changes; the change is recorded as a new range beginning that day.
        ranges:
          type: array
          items:
            $ref: "#/components/schemas/RecurringSeriesRange"

    RecurringSeriesTerm:
      type: object
      description: |
        One date-ranged amount/account entry. A transaction matches it only when
        its date falls within [startDate, endDate) (endDate omitted = open).
      properties:
        id:
          type: string
          format: uuid
        seriesId:
          type: string
          format: uuid
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
          nullable: true
        amount:
          type: number
        accountId:
          type: string
          format: uuid
        accountName:
          type: string
        createdAt:
          type: string
          format: date-time

    CreateRecurringSeriesTermRequest:
      type: object
      required:
        - startDate
        - amount
        - accountId
      properties:
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
          description: Exclusive range end; omit for an open-ended entry
        amount:
          type: number
        accountId:
          type: string
          format: uuid

    UpdateRecurringSeriesTermRequest:
      type: object
      description: Partial update; absent fields are left unchanged.
      properties:
        startDate:
          type: string
          format: date
        endDate:
          type: string
          description: A date to set (exclusive), or an empty string to make it open-ended
        amount:
          type: number
        accountId:
          type: string
          format: uuid

    RecurringAttachRequest:
      type: object
      required:
        - seriesId
        - transactionIds
      properties:
        seriesId:
          type: string
          format: uuid
        transactionIds:
          type: array
          items:
            type: string
            format: uuid

    RecurringDetachRequest:
      type: object
      required:
        - transactionIds
      properties:
        transactionIds:
          type: array
          items:
            type: string
            format: uuid

    # ============= Backup & Restore =============
    BackupBundle:
      type: object
      required:
        - format
        - version
        - exportedAt
      properties:
        format:
          type: string
          example: fintrak.backup
        version:
          type: integer
          example: 1
        exportedAt:
          type: string
          format: date-time
        settings:
          $ref: "#/components/schemas/BackupSettings"
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/BackupAccount"
        categoryGroups:
          type: array
          items:
            $ref: "#/components/schemas/BackupCategoryGroup"
        categories:
          type: array
          items:
            $ref: "#/components/schemas/BackupCategory"
        payees:
          type: array
          items:
            $ref: "#/components/schemas/BackupPayee"
        billingCycles:
          type: array
          items:
            $ref: "#/components/schemas/BackupBillingCycle"
        transactions:
          type: array
          items:
            $ref: "#/components/schemas/BackupTransaction"
        links:
          type: array
          items:
            $ref: "#/components/schemas/BackupLink"
        loanAttachments:
          type: array
          items:
            $ref: "#/components/schemas/BackupLoanAttachment"
        loanSchedules:
          type: array
          items:
            $ref: "#/components/schemas/BackupLoanSchedule"
        loanTransfers:
          type: array
          items:
            $ref: "#/components/schemas/BackupLoanTransfer"
        loanDisbursements:
          type: array
          items:
            $ref: "#/components/schemas/BackupLoanDisbursement"
        recurringSeries:
          type: array
          items:
            $ref: "#/components/schemas/BackupRecurringSeries"
        recurringTerms:
          type: array
          items:
            $ref: "#/components/schemas/BackupRecurringTerm"
        recurringAttachments:
          type: array
          items:
            $ref: "#/components/schemas/BackupRecurringAttachment"
        rules:
          type: array
          items:
            $ref: "#/components/schemas/BackupRule"

    BackupSettings:
      type: object
      description: Non-secret user settings. The Paperless API token is never exported.
      properties:
        paperlessUrl:
          type: string
        paperlessTag:
          type: string
        pageSize:
          type: integer

    BackupAccount:
      type: object
      required: [id, name, accountTypeId]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        accountTypeId:
          type: string
        bank:
          type: string
        currency:
          type: string
        color:
          type: string
        isDefault:
          type: boolean
        billingDay:
          type: integer
          nullable: true
        closed:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    BackupCategoryGroup:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
        icon:
          type: string
        color:
          type: string
        sortOrder:
          type: integer

    BackupCategory:
      type: object
      required: [id, name, groupId]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        icon:
          type: string
        color:
          type: string
        groupId:
          type: string
        global:
          type: boolean
          description: True for an admin-created global category the user references but does not own.

    BackupPayee:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        accountId:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    BackupBillingCycle:
      type: object
      required: [id, accountId, startDate, endDate]
      properties:
        id:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        label:
          type: string
        createdAt:
          type: string
          format: date-time

    BackupTransaction:
      type: object
      required: [id, accountId, date, description, amount, type]
      properties:
        id:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
        date:
          type: string
          format: date
        description:
          type: string
        amount:
          type: number
        type:
          type: string
          enum: [debit, credit]
        categoryId:
          type: string
          format: uuid
          nullable: true
        tags:
          type: array
          items:
            type: string
        notes:
          type: string
        payeeId:
          type: string
          format: uuid
          nullable: true
        billingCycleId:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    BackupLink:
      type: object
      required: [id, type, fromTxnId, toTxnId]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [transfer, cashback, refund, bill_payment]
        fromTxnId:
          type: string
          format: uuid
        toTxnId:
          type: string
          format: uuid
        notes:
          type: string
        createdAt:
          type: string
          format: date-time

    BackupLoanAttachment:
      type: object
      required: [id, loanAccountId, transactionId]
      properties:
        id:
          type: string
          format: uuid
        loanAccountId:
          type: string
          format: uuid
        transactionId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time

    BackupLoanSchedule:
      type: object
      required: [id, loanAccountId, principal, annualRateBps, tenureMonths, startDate]
      description: A loan account's optional amortization schedule.
      properties:
        id:
          type: string
          format: uuid
        loanAccountId:
          type: string
          format: uuid
        principal:
          type: integer
          description: Minor units (cents).
        processingFee:
          type: integer
          description: >-
            Minor units (cents); what the lender charged, recorded for reference
            — it is never amortized.
        annualRateBps:
          type: integer
        tenureMonths:
          type: integer
        startDate:
          type: string
          format: date
        disbursalDate:
          type: string
          format: date
          description: Optional; empty when the first period is a whole month.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    BackupLoanTransfer:
      type: object
      required: [id, fromLoanAccountId, toLoanAccountId, amount, transferDate]
      description: >-
        A balance transfer between two loan accounts. It is exported because
        both loans' amortization tables are derived from it.
      properties:
        id:
          type: string
          format: uuid
        fromLoanAccountId:
          type: string
          format: uuid
        toLoanAccountId:
          type: string
          format: uuid
        amount:
          type: integer
          description: Minor units (cents); the payoff that moved.
        principal:
          type: integer
          description: Minor units (cents); the part of the amount that was principal.
        transferDate:
          type: string
          format: date
        mode:
          type: string
          enum: [recast, opens, takeover]
          description: What the transfer did to the target loan.
        createdAt:
          type: string
          format: date-time

    BackupLoanDisbursement:
      type: object
      required: [id, loanAccountId, transactionId]
      description: >-
        The bank credit that released a loan, so a restored loan still
        reconciles its disbursement against the same transaction.
      properties:
        id:
          type: string
          format: uuid
        loanAccountId:
          type: string
          format: uuid
        transactionId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time

    BackupRecurringSeries:
      type: object
      description: |
        A recurring series/subscription template. Its amount, account and date
        range live on its terms (BackupRecurringTerm).
      required: [id, name, type, frequency, interval]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        type:
          type: string
          enum: [debit, credit]
        frequency:
          type: string
          enum: [daily, weekly, monthly, yearly]
        interval:
          type: integer
        categoryId:
          type: string
          format: uuid
          nullable: true
        payeeId:
          type: string
          format: uuid
          nullable: true
        active:
          type: boolean
        notes:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    BackupRecurringTerm:
      type: object
      required: [id, seriesId, startDate, amount, accountId]
      properties:
        id:
          type: string
          format: uuid
        seriesId:
          type: string
          format: uuid
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
          nullable: true
        amount:
          type: number
        accountId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time

    BackupRecurringAttachment:
      type: object
      required: [id, seriesId, transactionId]
      properties:
        id:
          type: string
          format: uuid
        seriesId:
          type: string
          format: uuid
        transactionId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time

    BackupRule:
      type: object
      required: [id, pattern, matchType, categoryId]
      properties:
        id:
          type: string
          format: uuid
        pattern:
          type: string
        matchType:
          type: string
          enum: [contains, starts_with, exact]
        categoryId:
          type: string
          format: uuid
        payeeId:
          type: string
          format: uuid
          nullable: true
        priority:
          type: integer
        accountId:
          type: string
          format: uuid
          nullable: true
        filterCategoryId:
          type: string
          format: uuid
          nullable: true
        filterPayeeId:
          type: string
          format: uuid
          nullable: true
        minAmount:
          type: number
          nullable: true
        maxAmount:
          type: number
          nullable: true
        txnType:
          type: string
          enum: [debit, credit]
        dateFrom:
          type: string
          format: date
          nullable: true
        dateTo:
          type: string
          format: date
          nullable: true
        isLinked:
          type: boolean
          nullable: true
        isRecurring:
          type: boolean
          nullable: true
        addTags:
          type: array
          items:
            type: string
        notes:
          type: string

    BackupImportResult:
      type: object
      properties:
        accounts:
          type: integer
        categoryGroups:
          type: integer
        categories:
          type: integer
        payees:
          type: integer
        billingCycles:
          type: integer
        transactions:
          type: integer
        links:
          type: integer
        loanAttachments:
          type: integer
        loanSchedules:
          type: integer
        loanTransfers:
          type: integer
        loanDisbursements:
          type: integer
        recurringSeries:
          type: integer
        recurringTerms:
          type: integer
        recurringAttachments:
          type: integer
        rules:
          type: integer
        warnings:
          type: array
          items:
            type: string

    # ============= Common =============
    ErrorResponse:
      type: object
      required:
        - errors
      properties:
        errors:
          type: array
          minItems: 1
          items:
            type: object
            required:
              - message
            properties:
              field:
                type: string
              tag:
                type: string
              message:
                type: string

    MessageResponse:
      type: object
      properties:
        message:
          type: string

  responses:
    BadRequest:
      description: Bad request (invalid input)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Unauthorized:
      description: Missing or invalid authentication token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Forbidden:
      description: User does not have permission to access this resource
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Optional alternative to the httpOnly access-token cookie. Use the
        access token delivered in the `fintrak_token` cookie by
        /auth/register, /auth/login, or /auth/refresh; the token itself is
        never returned in a response body.
