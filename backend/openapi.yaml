    ValidateTransactionResult:
      type: object
      properties:
        index:
          type: integer
        exists:
          type: boolean
        date:
          type: string
          format: date
        description:
          type: string
        amount:
          type: number
        type:
          type: string
          enum: [debit, credit]

    ValidateTransactionsResponse:
      type: object
      properties:
        total:
          type: integer
        existingCount:
          type: integer
        missingCount:
          type: integer
        results:
          type: array
          items:
            $ref: "#/components/schemas/ValidateTransactionResult"

    ParseStatementResult:
      type: object
      properties:
        transactions:
