openapi: 3.0.3
info:
  title: FinTrak
  description: |
    Personal finance tracker API. All API endpoints are prefixed with `/api/v1`.

    ## Authentication
    `/auth/register` and `/auth/login` authenticate the user and set two
    httpOnly, `SameSite=Lax` cookies: a short-lived access token
    (`fintrak_token`, 15 minutes) sent with every API request, and a long-lived
    refresh token (`fintrak_refresh`, 30 days) scoped to the auth endpoints.
    Neither token is ever returned in a response body. Browsers send the
    cookies automatically, which is how the SPA authenticates.

    When the access token expires the client calls `POST /auth/refresh`, which
    trades the refresh cookie for a fresh access token. Refreshing never
    extends a session past its original 30-day deadline; after that the user
    must log in again.

    For non-browser clients, protected routes also accept a Bearer token in the
    `Authorization` header, using the value of the access-token cookie:
    ```
    Authorization: Bearer <token>
    ```
  version: 0.1.0-alpha.0
  contact:
    name: FinTrak
  license:
    name: AGPL v3.0

servers:
  - url: http://localhost:8080/api/v1
    description: Development server

paths:
  /health:
    get:
      tags:
        - System
      summary: Health check
      description: Returns the health status of the API
      operationId: getHealth
      responses:
        "200":
          description: API is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /openapi.yaml:
    get:
      tags:
        - System
      summary: Get the OpenAPI contract
      description: Returns this document as YAML.
      operationId: getOpenApiSpec
      responses:
        "200":
          description: The OpenAPI document.
          content:
            application/yaml:
              schema:
                type: string

  # ============= Authentication =============
  /auth/register:
    post:
      tags:
        - Authentication
      summary: Register a new user
      description: Create a new user account. Access and refresh tokens are set as httpOnly cookies, not returned in the body.
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: An account with this email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /auth/login:
    post:
      tags:
        - Authentication
      summary: Login a user
      description: Authenticate a user. Access and refresh tokens are set as httpOnly cookies, not returned in the body.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /auth/refresh:
    post:
      tags:
        - Authentication
      summary: Refresh the access token
      description: |
        Exchange the long-lived refresh cookie (`fintrak_refresh`) for a fresh
        short-lived access token (`fintrak_token`). This endpoint is public
        because the access token is expected to have expired; it authenticates
        with the refresh cookie instead. Refreshing does not extend the
        session's original 30-day deadline. On failure both cookies are
        cleared.
      operationId: refresh
      responses:
        "200":
          description: Access token refreshed
        "401":
          description: Missing, invalid, or expired refresh token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /auth/logout:
    post:
      tags:
        - Authentication
      summary: Log out
      description: Clears the session cookie.
      operationId: logout
      responses:
        "200":
          description: Logged out
        "500":
          $ref: "#/components/responses/InternalServerError"

  /auth/me:
    get:
      tags:
        - Authentication
      summary: Get the current user
      description: Returns the authenticated user for the current session cookie.
      operationId: getMe
      security:
        - BearerAuth: []
      responses:
        "200":
          description: The current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ============= Accounts =============
  /accounts:
    get:
      tags:
        - Accounts
      summary: List all accounts
      description: Get all accounts belonging to the authenticated user
      operationId: getAccounts
      security:
        - BearerAuth: []
      responses:
        "200":
          description: List of accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

    post:
      tags:
        - Accounts
      summary: Create a new account
      description: Create a new bank or credit-card account
      operationId: createAccount
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccountRequest"
      responses:
        "201":
          description: Account created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /accounts/{id}:
    put:
      tags:
        - Accounts
      summary: Update an account
      description: Update account details (name, type, bank, currency, color, default status)
      operationId: updateAccount
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: Account ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAccountRequest"
      responses:
        "200":
          description: Account updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

    delete:
      tags:
        - Accounts
      summary: Delete an account
      description: Delete an account and its associated payee
      operationId: deleteAccount
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: Account ID
      responses:
        "200":
          description: Account deleted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /accounts/{id}/export:
    get:
      tags:
        - Accounts
      summary: Export account transactions as CSV
      description: >
        Download all transactions for an account as a CSV file, newest date
        first, credits before debits inside a day.
      operationId: exportAccount
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: Account ID
      responses:
        "200":
          description: CSV file
          content:
            text/csv:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /accounts/{id}/billing-cycles:
    get:
      tags:
        - Accounts
      summary: Get billing cycles for a credit card account
      description: List all billing cycles for a credit-card account with transaction counts and outstanding totals. Cycles are auto-generated one per month, ending on the account's billingDay. totalOutstanding is the account's running balance at the cycle's end date (all debits minus all credits — purchases, payments, refunds, cashbacks — posted up to that date). Non-credit-card accounts return an empty list.
      operationId: getBillingCycles
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: Account ID
      responses:
        "200":
          description: Billing cycles
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/BillingCycle"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /accounts/{id}/loan-schedule:
    get:
      tags:
        - Accounts
      summary: Get a loan account's amortization schedule
      description: >-
        Return a Loan / EMI account's optional amortization schedule: the terms,
        the generated table (every installment split into principal and
        interest, with its remaining balance), and progress derived from the EMI
        transactions attached to the loan. The table amortizes the whole
        principal — the processing fee is recorded for reference and changes
        nothing — and a disbursal date that makes the first period a broken
        month charges that period its actual days over a 30-day month inside a
        re-solved EMI, so the installments stay level. A balance transfer that settled this loan cancels its unpaid
        installments; one it absorbed recasts the installments due after it.
        The transfers it took part in are listed in `transfers`.

        Attached payments are matched to installments in date order (the Nth
        payment pays the Nth installment); a credit (refund) reduces `paidAmount`
        without covering an installment. The schedule is optional, so an
        unconfigured loan answers 200 with `schedule: null` and an empty
        `entries` list rather than 404. 400 when the account is not a Loan / EMI
        account.
      operationId: getLoanSchedule
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: Loan / EMI account ID
      responses:
        "200":
          description: Amortization schedule and progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoanScheduleDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    put:
      tags:
        - Accounts
      summary: Create or replace a loan account's amortization schedule
      description: >-
        Store the terms (principal, processing fee, annual rate in basis points,
        tenure in months, first installment date, optional disbursal date) that
        the amortization table is generated from, and return the same detail as
        `GET`. A rate of 0 is valid (an interest-free loan). The fee is recorded
        for reference only — it must be non-negative and it never changes the EMI
        or the table, which amortize the principal in full. A disbursal date must
        be before the first installment date and makes the first period a stub
        when it is not a whole month; an empty one clears it. One
        schedule per loan account; an existing one is replaced.
      operationId: upsertLoanSchedule
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: Loan / EMI account ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoanScheduleRequest"
      responses:
        "200":
          description: The saved schedule and its generated table
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoanScheduleDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags:
        - Accounts
      summary: Delete a loan account's amortization schedule
      description: >-
        Remove the schedule. Idempotent: deleting an unconfigured loan reports
        `deleted: 0`.
      operationId: deleteLoanSchedule
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: Loan / EMI account ID
      responses:
        "200":
          description: Deletion result
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: integer
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /accounts/{id}/loan-transfer:
    post:
      tags:
        - Accounts
      summary: Transfer a loan's remaining principal to another loan
      description: >-
        Settle this loan (the source) at its outstanding principal on
        `transferDate` and move that amount onto `toLoanAccountId`, which
        absorbs it: the target's installments still due after the transfer date
        are recast over the larger balance, so its EMI changes from then on and
        those installments come back marked `recast`. The source's unpaid
        installments come back marked `cancelled`, with nothing outstanding.

        The amount is not a request field — it is the source's payoff, the
        figure `GET /accounts/{id}/loan-payoff` quotes for the same date: the
        principal it still owes plus the interest accrued since its last EMI
        payment. `mode`
        decides what the target does with it: `recast` (the default for a target
        that has a schedule) adds it to the installments the target still owes,
        `takeover` leaves the target's own table alone and pays the source out of
        the target's disbursement — which has to cover it — and `opens` (the
        default when the target has no schedule) starts the target's schedule
        from the amount using `targetAnnualRateBps`, `targetTenureMonths` and
        `targetStartDate`, all three of which are then required.

        Every derived figure on both loans comes from the recorded transfer, so
        `DELETE /accounts/{id}/loan-transfer/{transferId}` reverts both — and
        removes the target's schedule too when this transfer is what created it.
      operationId: transferLoanBalance
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: Source Loan / EMI account ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoanTransferRequest"
      responses:
        "200":
          description: The recorded transfer and both loans' regenerated tables
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoanTransferResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: A concurrent request already settled this source loan
        "500":
          $ref: "#/components/responses/InternalServerError"

  /accounts/{id}/loan-transfer/{transferId}:
    delete:
      tags:
        - Accounts
      summary: Delete a loan balance transfer
      description: >-
        Remove a recorded transfer, which reverts both loans: the target's
        recast installments and the source's cancelled ones are all derived from
        the transfer row. When the transfer is what created the target's
        schedule (the target had no terms of its own), that schedule is removed
        with it — it holds the moved amount as its principal — while a schedule
        the target already had is left alone. `id` must be the transfer's source
        account, so the same transfer cannot be deleted through an unrelated
        account. Idempotent: reports `deleted: 0` when no such transfer exists.
      operationId: deleteLoanTransfer
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: Source Loan / EMI account ID
        - in: path
          name: transferId
          required: true
          schema:
            type: string
            format: uuid
          description: Balance transfer ID
      responses:
        "200":
          description: Deletion result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteLoanTransferResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /accounts/{id}/loan-payoff:
    get:
      tags:
        - Accounts
      summary: Quote what settling a loan on a date costs
      description: >-
        The principal the loan still owes plus the interest accrued since its
        last EMI payment — the figure a lender's payoff quote should match, and
        exactly the amount a balance transfer moves (the two share one
        computation, so a quote and the transfer it precedes cannot disagree).
        Interest accrues from the last EMI *payment* date, since paying an
        installment is what clears it, falling back to the disbursal date — or
        the month before the first installment — when nothing has been paid yet.
        The date is required rather than defaulted to today, so the same request
        always answers the same thing. 400 for a loan with no schedule or one
        already settled by a transfer.
      operationId: getLoanPayoff
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: Loan / EMI account ID
        - in: query
          name: date
          required: true
          schema:
            type: string
            format: date
          description: The date to quote for (YYYY-MM-DD).
      responses:
        "200":
          description: The settlement quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoanPayoff"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /accounts/{id}/loan-disbursement:
    put:
      tags:
        - Accounts
      summary: Link the bank credit that released a loan
      description: >-
        Record the transaction that actually released the loan, so the
        disbursement its schedule implies — the sanctioned principal less the
        processing fee and less any balance-transfer takeover it funded — can be
        reconciled against what arrived. The comparison is reported on the loan
        (`disbursement.verified` and `difference`), never enforced: a mismatch is
        the thing the user needs to see.

        The credit must be a credit transaction on one of the caller's own
        accounts, and it cannot already be an EMI payment or another loan's
        disbursement. Linking a second credit to the same loan replaces the
        first.
      operationId: linkLoanDisbursement
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: Loan / EMI account ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoanDisbursementRequest"
      responses:
        "200":
          description: The loan detail with the linked credit reconciled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoanScheduleDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The transaction is already an EMI payment or another loan's disbursement credit
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags:
        - Accounts
      summary: Unlink a loan's disbursement credit
      description: >-
        Forget which credit released the loan. Idempotent: reports `deleted: 0`
        when the loan has none.
      operationId: unlinkLoanDisbursement
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: Loan / EMI account ID
      responses:
        "200":
          description: Deletion result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteLoanDisbursementResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # ============= Account Types =============
  /account-types:
    get:
      tags:
        - Account Types
      summary: List account types
      description: Get all available account types (e.g., bank, credit_card)
      operationId: getAccountTypes
      security:
        - BearerAuth: []
      responses:
        "200":
          description: List of account types
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AccountType"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

    post:
      tags:
        - Account Types
      summary: Create a new account type
      description: Create a new custom account type (admin only)
      operationId: createAccountType
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccountTypeRequest"
      responses:
        "201":
          description: Account type created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountType"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /account-types/{id}:
    put:
      tags:
        - Account Types
      summary: Update an account type
      description: Update a custom account type (admin only)
      operationId: updateAccountType
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Account type ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAccountTypeRequest"
      responses:
        "200":
          description: Account type updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountType"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

    delete:
      tags:
        - Account Types
      summary: Delete an account type
      description: Delete a custom account type (admin only)
      operationId: deleteAccountType
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Account type ID
      responses:
        "200":
          description: Account type deleted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Account type is in use by existing accounts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # ============= Transactions =============
  /transactions:
    get:
      tags:
        - Transactions
      summary: List transactions
      description: >
        Get transactions with optional filtering, sorting, and pagination. The
        order is total, so identical requests return the same rows in the same
        sequence: ties on the sort column are broken by the transaction id and,
        when sorting by date, by type — credits before debits inside a calendar
        day. The id filters (accountId, categoryId, payeeId) each take a
        comma-separated list and match a transaction that satisfies ANY entry,
        so a single value is a one-element list.
      operationId: getTransactions
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: accountId
          schema:
            type: string
          description: >
            Filter by account ID, comma-separated to match any of several
            accounts. Loan accounts are passed in loanAccountId instead, which
            matches their attached EMI payments.
        - in: query
          name: categoryId
          schema:
            type: string
          description: >
            Filter by category ID (or a group id/slug, which matches every
            category in that group), comma-separated to match any of several.
            The "uncategorized" sentinel matches transactions with no category.
        - in: query
          name: payeeId
          schema:
            type: string
          description: >
            Filter by payee ID, comma-separated to match any of several. The
            "none" sentinel matches transactions with no payee.
        - in: query
          name: search
          schema:
            type: string
          description: >
            Case-insensitive free text matched against the description, notes,
            payee name, and tags (substring, with % and _ treated literally).
        - in: query
          name: dateFrom
          schema:
            type: string
            format: date
          description: Filter transactions from this date (YYYY-MM-DD)
        - in: query
          name: dateTo
          schema:
            type: string
            format: date
          description: Filter transactions until this date (YYYY-MM-DD)
        - in: query
          name: type
          schema:
            type: string
            enum: [debit, credit]
          description: Filter by transaction type
        - in: query
          name: amount
          schema:
            type: number
          description: Filter by exact amount
        - in: query
          name: uncategorized
          schema:
            type: string
            enum: ["true", "false"]
          description: Filter for uncategorized transactions only
        - in: query
          name: linked
          schema:
            type: string
            enum: ["true", "false"]
          description: Filter by link status
        - in: query
          name: recurringId
          schema:
            type: string
            format: uuid
          description: Only transactions linked to this recurring series
        - in: query
          name: recurring
          schema:
            type: string
            enum: [linked, unlinked]
          description: Filter by whether the transaction is linked to any recurring series
        - in: query
          name: sortBy
          schema:
            type: string
            enum: [date, amount, createdAt]
            default: date
          description: Sort column
        - in: query
          name: sortOrder
          schema:
            type: string
            enum: [ASC, DESC]
            default: DESC
          description: Sort direction
        - in: query
          name: page
          schema:
            type: integer
            default: 1
            minimum: 1
          description: Page number (1-indexed)
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
          description: Items per page (0 = no pagination, return all)
      responses:
        "200":
          description: List of transactions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

    post:
      tags:
        - Transactions
      summary: Create a new transaction
      operationId: createTransaction
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTransactionRequest"
      responses:
        "201":
          description: Transaction created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
        "200":
          description: |
            The transaction this clientKey already created (an idempotent
            replay); nothing was inserted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

