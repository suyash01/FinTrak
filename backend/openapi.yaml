  /transactions/bulk-loan:
    post:
      tags:
        - Transactions
      summary: Attach transactions to a Loan / EMI account, or detach them
      description: >
        Attaches the given transactions as EMI payments to a single Loan / EMI
        account (loanAccountId set) or detaches them from whatever loan account
        they are currently attached to (loanAccountId omitted/null). A
        transaction can be attached to at most one loan account; already-linked
        transactions must be detached first (409). Attaching also sets each
        transaction's payee to the loan account's linked payee, so EMI payments read
        as paid to the loan. Detaching leaves payees unchanged.
      operationId: bulkLinkLoan
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkLoanRequest"
      responses:
        "200":
          description: Linking completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  attached:
                    type: integer
                  detached:
                    type: integer
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: One or more transactions are already linked to a loan account
        "500":
          $ref: "#/components/responses/InternalServerError"

  /transactions/export:
    get:
      tags:
        - Transactions
      summary: Export the filtered transactions as CSV
      description: >
        Streams a flat CSV of the user's transactions honoring the same filter
        grammar as GET /transactions (account, category/groupId, payee, tags,
        search, date range, type, amount, linked, loan, recurring). Every id
        filter takes a comma-separated list and matches a transaction that
        satisfies ANY entry, so a single value is a one-element list. Unlike the
        per-account export it covers whatever the caller has filtered to and
        includes account/category/group/payee names. Rows come in the same
        total order as GET /transactions. A filter that matches more than
        100,000 rows is refused with 400 rather than truncated, so a
        downloaded file is never silently partial.
      operationId: exportTransactions
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: accountId
          schema: { type: string }
          description: >
            Filter by account ID, comma-separated to match any of several.
            Loan accounts are passed in loanAccountId instead.
        - in: query
          name: categoryId
          schema: { type: string }
          description: >
            Filter by category ID, comma-separated to match any of several.
            The "uncategorized" sentinel matches transactions with no category.
        - in: query
          name: groupId
          schema: { type: string }
          description: >
            Filter by category group id/slug, comma-separated to match any of
            several. Combines with categoryId as one OR-ed category filter.
        - in: query
          name: payeeId
          schema: { type: string }
          description: >
            Filter by payee ID, comma-separated to match any of several. The
            "none" sentinel matches transactions with no payee.
        - in: query
          name: tags
          schema: { type: string }
          description: Comma-separated tag list; matches transactions with any of them.
        - in: query
          name: loanAccountId
          schema: { type: string }
          description: >
            Loan account id, comma-separated to match any of several; matches
            transactions attached to those loan accounts as EMI payments.
            Combines with accountId as one OR-ed account filter.
        - in: query
          name: search
          schema: { type: string }
          description: >
            Case-insensitive free text matched against the description, notes,
            payee name, and tags.
        - in: query
          name: dateFrom
          schema: { type: string, format: date }
        - in: query
          name: dateTo
          schema: { type: string, format: date }
        - in: query
          name: type
          schema: { type: string, enum: [debit, credit] }
        - in: query
          name: amount
          schema: { type: string }
        - in: query
          name: linked
          schema: { type: string, enum: ["true", "false"] }
        - in: query
          name: recurringId
          schema: { type: string }
        - in: query
          name: recurring
          schema: { type: string, enum: [linked, unlinked] }
      responses:
        "200":
          description: CSV file
          content:
            text/csv:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

