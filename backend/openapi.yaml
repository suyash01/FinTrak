          type: string

    UpdateUserSettingsRequest:
      type: object
      properties:
        paperlessUrl:
          type: string
        paperlessToken:
          type: string
        paperlessTag:
          type: string
        pageSize:
          type: integer
          nullable: true

    # ============= Responses =============
    AuthResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT bearer token
        user:
          $ref: "#/components/schemas/User"

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
          enum: [user, admin]
          description: The user's role (admin when their email is in the configured admin allowlist)

    Account:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        accountTypeId:
          type: string
        accountTypeName:
          type: string
        bank:
          type: string
        currency:
          type: string
        color:
          type: string
        isDefault:
          type: boolean
        balance:
          type: number
          format: double
        billingDay:
          type: integer
          minimum: 1
          maximum: 31
          description: Credit-card billing day on which each billing cycle ends (default 1)

    AccountType:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        positiveTxnType:
          type: string
          enum: [credit, debit]

    Transaction:
      type: object
      properties:
        id:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
        accountName:
          type: string
        date:
          type: string
          format: date-time
        description:
          type: string
        amount:
          type: number
          format: double
        type:
          type: string
          enum: [debit, credit]
        categoryId:
          type: string
          format: uuid
        categoryName:
          type: string
        categoryIcon:
          type: string
        categoryColor:
          type: string
        payeeId:
          type: string
          format: uuid
        payee:
          type: string
        tags:
          type: array
          items:
            type: string
        notes:
          type: string
        isLinked:
          type: boolean
        linkCount:
          type: integer
        linkId:
          type: string
          format: uuid
        billingCycleId:
          type: string
          format: uuid
        billingCycleLabel:
          type: string
        createdAt:
          type: string
          format: date-time
        isSummary:
          type: boolean

    TransactionListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Transaction"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        pages:
          type: integer

    Category:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        icon:
          type: string
        color:
          type: string
        type:
          type: string

    Payee:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        accountId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Rule:
      type: object
      properties:
        id:
          type: string
          format: uuid
        pattern:
          type: string
        matchType:
          type: string
          enum: [contains, starts_with, exact]
        categoryId:
          type: string
          format: uuid
        categoryName:
          type: string
        payeeId:
          type: string
          format: uuid
        payee:
          type: string
        priority:
          type: integer

    Link:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [transfer, cashback, refund, bill_payment]
        fromTxnId:
          type: string
          format: uuid
        toTxnId:
          type: string
          format: uuid
        notes:
          type: string
        createdAt:
          type: string
          format: date-time
        fromTxn:
          $ref: "#/components/schemas/Transaction"
        toTxn:
          $ref: "#/components/schemas/Transaction"

    BillingCycle:
      type: object
      properties:
        id:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        label:
          type: string
        totalOutstanding:
                  type: number
                  format: double
                  description: Running balance at the cycle's end date — all debits minus all credits (purchases, payments, refunds, cashbacks) posted up to that date.
        transactionCount:
          type: integer

    PaperlessDocument:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        correspondent:
          type: string
        documentType:
          type: string
        created:
          type: string
        tags:
          type: array
          items:
            type: string

    PaperlessSettingsResponse:
      type: object
      properties:
        paperlessUrl:
          type: string
        hasToken:
          type: boolean
          description: Whether a Paperless API token is configured (the token itself is never returned)
        paperlessTag:
          type: string
        pageSize:
          type: integer

    ParseStatementTransaction:
      type: object
      properties:
        date:
          type: string
          format: date
        description:
          type: string
        amount:
          type: number
        type:
          type: string
          enum: [debit, credit]

    ImportResponse:
      type: object
      properties:
        imported:
          type: integer
        duplicates:
          type: integer
        total:
          type: integer

    ValidateTransactionResult:
      type: object
      properties:
        index:
          type: integer
        exists:
          type: boolean
        date:
          type: string
          format: date
        description:
          type: string
        amount:
          type: number
        type:
          type: string
          enum: [debit, credit]

    ValidateTransactionsResponse:
      type: object
      properties:
        total:
          type: integer
        existingCount:
          type: integer
        missingCount:
          type: integer
        results:
          type: array
          items:
            $ref: "#/components/schemas/ValidateTransactionResult"

    ParseStatementResult:
      type: object
      properties:
