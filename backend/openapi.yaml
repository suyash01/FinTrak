          type: string
          format: uuid
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        label:
          type: string

    BillingCycleTrendItem:
      type: object
      properties:
        label:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        income:
          type: number
        expense:
          type: number

    DashboardSummary:
      type: object
      properties:
        totalAccounts:
          type: integer
        totalTransactions:
          type: integer
        totalIncome:
          type: number
        totalExpense:
          type: number
        byCategory:
          type: array
          items:
            $ref: "#/components/schemas/CategorySpend"
        incomeByCategory:
          type: array
          items:
            $ref: "#/components/schemas/CategorySpend"
        monthlyTrend:
          type: array
          items:
            $ref: "#/components/schemas/MonthlyData"
        recentTransactions:
          type: array
          items:
            $ref: "#/components/schemas/Transaction"
        currentCycle:
          $ref: "#/components/schemas/CurrentCycleInfo"
        billingCycleTrend:
          type: array
          items:
            $ref: "#/components/schemas/BillingCycleTrendItem"

    # ============= Common =============
    ErrorResponse:
      type: object
      required:
        - errors
      properties:
        errors:
          type: array
          minItems: 1
          items:
            type: object
            required:
              - message
            properties:
              field:
                type: string
              tag:
                type: string
              message:
                type: string

    MessageResponse:
      type: object
      properties:
        message:
          type: string

  responses:
    BadRequest:
      description: Bad request (invalid input)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Unauthorized:
      description: Missing or invalid authentication token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Forbidden:
      description: User does not have permission to access this resource
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from /auth/register or /auth/login
