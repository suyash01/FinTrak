          type: string
          format: uuid
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        label:
          type: string

    BillingCycleTrendItem:
      type: object
      properties:
        label:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        income:
          type: number
        expense:
          type: number

    DashboardSummary:
      type: object
      properties:
        totalAccounts:
          type: integer
        totalTransactions:
          type: integer
        totalIncome:
          type: number
        totalExpense:
          type: number
        byCategory:
          type: array
          items:
            $ref: "#/components/schemas/CategorySpend"
        incomeByCategory:
          type: array
          items:
            $ref: "#/components/schemas/CategorySpend"
        monthlyTrend:
          type: array
          items:
            $ref: "#/components/schemas/MonthlyData"
        recentTransactions:
          type: array
          items:
            $ref: "#/components/schemas/Transaction"
        currentCycle:
          $ref: "#/components/schemas/CurrentCycleInfo"
        billingCycleTrend:
          type: array
          items:
            $ref: "#/components/schemas/BillingCycleTrendItem"

    # ============= Recurring Series =============
    RecurringSeries:
      type: object
      properties:
        id:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
          description: Account of the term in effect today (derived from the series' terms)
        name:
          type: string
        description:
          type: string
        amount:
          type: number
          description: Amount of the term in effect today (derived from the series' terms)
        type:
          type: string
          enum: [debit, credit]
        frequency:
          type: string
          enum: [daily, weekly, monthly, yearly]
        interval:
          type: integer
        startDate:
          type: string
          format: date
          description: Earliest term start (derived from the series' terms)
        endDate:
          type: string
          format: date
          nullable: true
          description: Latest term end (nil while open-ended; derived from the series' terms)
        categoryId:
          type: string
          format: uuid
          nullable: true
        payeeId:
          type: string
          format: uuid
          nullable: true
        active:
          type: boolean
        notes:
          type: string
        createdAt:
          type: string
          format: date-time
        accountName:
          type: string
        categoryName:
          type: string
        categoryIcon:
          type: string
        categoryColor:
          type: string
        payee:
          type: string
        nextDueDate:
          type: string
          format: date
          nullable: true
          description: Next occurrence on/after today (omitted once the series has ended)
        monthlyAmount:
          type: number
          description: Estimated monthly cost (normalized from the frequency and interval)
        attachedCount:
          type: integer

    RecurringForecastItem:
      type: object
      properties:
        date:
          type: string
          format: date
        amount:
          type: number
        type:
          type: string
          enum: [debit, credit]
        matched:
          type: boolean
          description: Whether an attached transaction already falls on (or near) this occurrence

    RecurringSuggestion:
      type: object
      properties:
        txn:
          $ref: "#/components/schemas/Transaction"
        score:
          type: number
        occurrenceDate:
          type: string
          format: date
        daysOff:
          type: number

    RecurringSeriesRange:
      type: object
      description: |
        One account/amount entry with its own date range. The end is exclusive:
        the entry applies from its startDate up to (but not including) endDate.
        Entries must not overlap, but gaps are allowed so a subscription can be
        discontinued and resumed. An omitted endDate is open-ended. The
        subscription's overall start/end are derived from the entries.
      required:
        - startDate
        - amount
        - accountId
      properties:
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
          description: Exclusive range end; omit to keep the entry open-ended
        amount:
          type: number
        accountId:
          type: string
          format: uuid

    CreateRecurringSeriesRequest:
      type: object
      description: |
        Either supply the full `ranges` list (which also derives the
        subscription's start and end), or a single `startDate` + `accountId` +
        `amount`.
      required:
        - name
        - type
        - frequency
      properties:
        accountId:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        amount:
          type: number
        type:
          type: string
          enum: [debit, credit]
        frequency:
          type: string
          enum: [daily, weekly, monthly, yearly]
        interval:
          type: integer
          minimum: 1
          default: 1
        startDate:
          type: string
          format: date
          description: Required unless `ranges` is supplied
        endDate:
          type: string
          format: date
          description: |
            Subscription end for the single-amount form (omit for open-ended).
            When `ranges` is supplied, each entry carries its own end instead.
        categoryId:
          type: string
          format: uuid
          nullable: true
        payeeId:
          type: string
          format: uuid
          nullable: true
        active:
          type: boolean
          default: true
        notes:
          type: string
        ranges:
          type: array
          items:
            $ref: "#/components/schemas/RecurringSeriesRange"

    UpdateRecurringSeriesRequest:
      type: object
      description: |
        Partial update; absent fields are left unchanged. When `ranges` is
        non-empty it replaces the series' whole range list; otherwise an
        `amount`/`accountId` change is recorded as a new range.
      properties:
        accountId:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        amount:
          type: number
        type:
          type: string
          enum: [debit, credit]
        frequency:
          type: string
          enum: [daily, weekly, monthly, yearly]
        interval:
          type: integer
          minimum: 1
        categoryId:
          type: string
          format: uuid
          nullable: true
        payeeId:
          type: string
          format: uuid
          nullable: true
        active:
          type: boolean
        notes:
          type: string
        effectiveDate:
          type: string
          format: date
          description: |
            When an amount/account change starts (default: today). Ignored when
            `ranges` is supplied, or unless the amount or account actually
            changes; the change is recorded as a new range beginning that day.
        ranges:
          type: array
          items:
            $ref: "#/components/schemas/RecurringSeriesRange"

    RecurringSeriesTerm:
      type: object
      description: |
        One date-ranged amount/account entry. A transaction matches it only when
        its date falls within [startDate, endDate) (endDate omitted = open).
      properties:
        id:
          type: string
          format: uuid
        seriesId:
          type: string
          format: uuid
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
          nullable: true
        amount:
          type: number
        accountId:
          type: string
          format: uuid
        accountName:
          type: string
        createdAt:
          type: string
          format: date-time

    CreateRecurringSeriesTermRequest:
      type: object
      required:
        - startDate
        - amount
        - accountId
      properties:
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
          description: Exclusive range end; omit for an open-ended entry
        amount:
          type: number
        accountId:
          type: string
          format: uuid

    UpdateRecurringSeriesTermRequest:
      type: object
      description: Partial update; absent fields are left unchanged.
      properties:
        startDate:
          type: string
          format: date
        endDate:
          type: string
          description: A date to set (exclusive), or an empty string to make it open-ended
        amount:
          type: number
        accountId:
          type: string
          format: uuid

    RecurringAttachRequest:
      type: object
      required:
        - seriesId
        - transactionIds
      properties:
        seriesId:
          type: string
          format: uuid
        transactionIds:
          type: array
          items:
            type: string
            format: uuid

    RecurringDetachRequest:
      type: object
      required:
        - transactionIds
      properties:
        transactionIds:
          type: array
          items:
            type: string
            format: uuid

    # ============= Backup & Restore =============
