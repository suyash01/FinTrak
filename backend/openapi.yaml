    # ============= Responses =============
    AuthResponse:
      type: object
      description: |
        Returned by register/login. The JWT is delivered as an httpOnly,
        SameSite=Lax session cookie (`fintrak_token`), never in the body, so
        only the user is present here.
      properties:
        user:
          $ref: "#/components/schemas/User"

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
