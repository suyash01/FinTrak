                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /rules/apply:
    post:
      tags:
        - Rules
      summary: Apply all rules to uncategorized transactions
      operationId: applyRules
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Rules applied successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated:
                    type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # ============= Links =============
  /links:
    get:
      tags:
        - Links
      summary: List all transaction links
      operationId: getLinks
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: type
          schema:
            type: string
            enum: [transfer, cashback, refund, bill_payment]
          description: Filter by link type
        - in: query
          name: txnId
          schema:
            type: string
            format: uuid
          description: Filter links involving a specific transaction
      responses:
        "200":
          description: List of links
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Link"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

    post:
      tags:
        - Links
      summary: Create a new link
      description: Link two transactions (e.g., transfer between accounts, cashback, refund, bill payment)
      operationId: createLink
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLinkRequest"
      responses:
        "201":
          description: Link created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Link"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Link already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /links/{id}:
    delete:
      tags:
        - Links
      summary: Delete a link
      operationId: deleteLink
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Link deleted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /links/bulk:
    post:
      tags:
        - Links
      summary: Create multiple links at once
      operationId: bulkCreateLinks
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkCreateLinksRequest"
      responses:
        "200":
          description: Bulk creation completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  createdCount:
                    type: integer
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /links/bulk-delete:
    post:
      tags:
        - Links
      summary: Delete multiple links at once
      operationId: bulkDeleteLinks
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkDeleteLinksRequest"
      responses:
        "200":
          description: Bulk deletion completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  deletedCount:
                    type: integer
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /links/transfer-suggestions:
    get:
      tags:
        - Links
      summary: Get transfer link suggestions
      description: Get suggested transfers between accounts based on matching amounts
      operationId: getTransferSuggestions
      security:
        - BearerAuth: []
      responses:
        "200":
          description: List of suggested transfers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TransferSuggestion"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /links/cashback-suggestions:
    get:
      tags:
        - Links
      summary: Get cashback link suggestions
      description: Get suggested cashback links based on matching amounts
      operationId: getCashbackSuggestions
      security:
        - BearerAuth: []
      responses:
        "200":
          description: List of suggested cashbacks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TransferSuggestion"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # ============= Statement Parsing =============
  /statements/parse:
    post:
      tags:
        - Statements
      summary: Parse a bank statement PDF
      description: |
        Upload a bank or credit-card statement PDF for automatic extraction.
        The PDF is forwarded to the standalone statement-parser service.
      operationId: parseStatement
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: PDF file to parse
                extractor:
                  type: string
                  description: Extractor name (e.g., "sbi_cc", "icici_cc")
                password:
                  type: string
                  description: PDF password if encrypted
                date_format:
                  type: string
                  description: Date format hint for the parser
              required:
                - file
      responses:
        "200":
          description: Statement parsed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParseStatementResult"
        "400":
          description: Invalid file or parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Password required or incorrect
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: File too large (max 20 MB)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Statement parser service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /statements/extractors:
    get:
      tags:
        - Statements
      summary: List available statement extractors
      description: Get the list of available parsers from the statement-parser service
      operationId: listStatementExtractors
      security:
        - BearerAuth: []
      responses:
        "200":
          description: List of extractors
          content:
            application/json:
              schema:
                type: object
                properties:
                  extractors:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        display_name:
                          type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          description: Statement parser service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # ============= Paperless Integration =============
  /paperless/settings:
    get:
      tags:
        - Paperless
      summary: Get Paperless settings
      description: Retrieve the current user's Paperless-ngx integration configuration
      operationId: getPaperlessSettings
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Settings retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaperlessSettingsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

    put:
      tags:
        - Paperless
      summary: Update Paperless settings
      description: Update Paperless-ngx configuration (URL, API token, tag label, page size)
      operationId: updatePaperlessSettings
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserSettingsRequest"
      responses:
        "200":
          description: Settings updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaperlessSettingsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /paperless/documents:
    get:
      tags:
        - Paperless
      summary: List Paperless documents
      description: >
        Fetch a page of documents from the user's Paperless-ngx instance.
        Filters and pagination are forwarded to Paperless so filtering happens
        server-side. The full correspondent/document-type/tag lookup tables are
        returned so the UI can render filter dropdowns without fetching every
        document.
      operationId: listPaperlessDocuments
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: search
          required: false
          schema:
            type: string
          description: Search over the document title only. Single-word queries are forwarded to Paperless as `title_search`; multi-word queries become a fielded Tantivy query (`title:"word" AND ...`, every word must appear in the title). OCR content is never searched.
        - in: query
          name: page
          required: false
          schema:
            type: integer
            default: 1
            minimum: 1
          description: Page number (1-based)
        - in: query
          name: pageSize
          required: false
          schema:
            type: integer
            default: 25
            minimum: 1
            maximum: 100
          description: Documents per page (Paperless caps this at 100)
        - in: query
          name: correspondentInc
          required: false
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
          description: Correspondent names to include (any match)
        - in: query
          name: correspondentExc
          required: false
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
          description: Correspondent names to exclude
        - in: query
          name: documentTypeInc
          required: false
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
          description: Document type names to include (any match)
        - in: query
          name: documentTypeExc
          required: false
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
          description: Document type names to exclude
        - in: query
          name: tagInc
          required: false
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
          description: Tag names to include (any match)
        - in: query
          name: tagExc
          required: false
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
          description: Tag names to exclude
      responses:
        "200":
          description: Paginated list of documents
          content:
            application/json:
              schema:
                type: object
                properties:
                  documents:
                    type: array
                    items:
                      $ref: "#/components/schemas/PaperlessDocument"
                  page:
                    type: integer
                  pageSize:
                    type: integer
                  totalCount:
                    type: integer
                  totalPages:
                    type: integer
                  correspondents:
                    type: array
                    items:
                      type: string
                  documentTypes:
                    type: array
                    items:
                      type: string
                  tags:
                    type: array
                    items:
                      type: string
        "400":
          description: Paperless is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          description: Paperless or parser service is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /paperless/documents/{id}/file:
    get:
      tags:
        - Paperless
      summary: Download a Paperless document file
      description: Download the original file for a Paperless document
      operationId: getPaperlessDocumentFile
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Paperless document ID
      responses:
        "200":
          description: Document file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          description: Paperless is not configured or invalid document ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Document not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Paperless is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /paperless/import:
    post:
      tags:
        - Paperless
      summary: Import a Paperless document
      description: Download and parse a document from Paperless-ngx for import
      operationId: importPaperlessDocument
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaperlessImportRequest"
      responses:
        "200":
          description: Document parsed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParseStatementResult"
        "400":
          description: Invalid request or Paperless not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Document not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Paperless or parser service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # ============= Dashboard =============
  /dashboard/summary:
    get:
      tags:
        - Dashboard
      summary: Get dashboard summary
      description: Get aggregate financial data with optional date range and account filters
      operationId: getDashboardSummary
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: dateFrom
          schema:
            type: string
            format: date
          description: Filter from date (YYYY-MM-DD)
        - in: query
          name: dateTo
          schema:
            type: string
            format: date
          description: Filter to date (YYYY-MM-DD)
        - in: query
          name: accountId
          schema:
            type: string
            format: uuid
          description: Filter by account ID
        - in: query
          name: groupBy
          schema:
            type: string
            enum:
              - billing_cycle
          description: >-
            When "billing_cycle", frame the whole summary around the statement
            periods of the account given by `accountId` (which must have a
            `billingDay` set). The stat totals and category breakdowns span the
            last `cycles` cycles, `billingCycleTrend` replaces `monthlyTrend`,
            and `currentCycle` describes the in-progress period. Date-range
            filters are ignored in this mode.
        - in: query
          name: cycles
          schema:
            type: integer
            default: 12
          description: Number of billing cycles to include in the window (1-60, used with groupBy=billing_cycle)
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  schemas:
    # ============= Requests =============
    RegisterRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6

    CreateAccountRequest:
      type: object
      required:
        - name
        - accountTypeId
      properties:
        name:
          type: string
        accountTypeId:
          type: string
        bank:
          type: string
        currency:
          type: string
          default: INR
        color:
          type: string
          default: "#06b6d4"
        isDefault:
          type: boolean
        billingDay:
          type: integer
          minimum: 1
          maximum: 31
          default: 1
          description: Credit-card billing day on which each billing cycle ends; only meaningful for credit-card accounts (defaults to 1)

    UpdateAccountRequest:
      type: object
      properties:
        name:
          type: string
        accountTypeId:
          type: string
        bank:
          type: string
        currency:
          type: string
        color:
          type: string
        isDefault:
          type: boolean
        billingDay:
          type: integer
          minimum: 1
          maximum: 31
          description: Credit-card billing day on which each billing cycle ends; omitted keeps the current value

    CreateAccountTypeRequest:
      type: object
      required:
        - id
        - name
        - positiveTxnType
      properties:
        id:
          type: string
          pattern: "^[a-z][a-z0-9_]{1,29}$"
          description: Custom type slug (2-30 chars, starts with a letter, lowercase letters/digits/underscores only)
        name:
          type: string
        positiveTxnType:
          type: string
          enum: [credit, debit]

    UpdateAccountTypeRequest:
      type: object
      properties:
        name:
          type: string
        positiveTxnType:
          type: string
          enum: [credit, debit]

    CreateTransactionRequest:
      type: object
      required:
        - accountId
        - date
        - description
        - amount
        - type
      properties:
        accountId:
          type: string
          format: uuid
        date:
          type: string
          format: date
        description:
          type: string
        amount:
          type: number
          minimum: 0
          exclusiveMinimum: true
        type:
          type: string
          enum: [debit, credit]
        categoryId:
          type: string
          format: uuid
        payeeId:
          type: string
          format: uuid
        tags:
          type: array
          items:
            type: string
        notes:
          type: string
        billingCycleId:
          type: string
          format: uuid

    UpdateTransactionRequest:
      type: object
      properties:
        categoryId:
          type: string
          format: uuid
          nullable: true
        tags:
          type: array
          items:
            type: string
        notes:
          type: string
        payeeId:
          type: string
          format: uuid
          nullable: true
        date:
          type: string
          format: date
        description:
          type: string
        amount:
          type: number
        type:
          type: string
          enum: [debit, credit]
        accountId:
          type: string
          format: uuid
        billingCycleId:
          type: string
          format: uuid
          nullable: true

    ImportTransaction:
      type: object
      required:
        - date
        - description
        - amount
        - type
      properties:
        date:
          type: string
          format: date
        description:
          type: string
        amount:
          type: number
          minimum: 0
          exclusiveMinimum: true
        type:
          type: string
          enum: [debit, credit]
        payeeId:
          type: string
          format: uuid

    ImportRequest:
      type: object
      required:
        - accountId
        - transactions
      properties:
        accountId:
          type: string
          format: uuid
        transactions:
          type: array
          items:
            $ref: "#/components/schemas/ImportTransaction"
        duplicateAction:
          type: string
          enum: [skip, keep]
          default: skip
        billingCycleId:
          type: string
          format: uuid
        paperlessDocumentIds:
          type: array
          items:
            type: integer

    ValidateTransactionsRequest:
      type: object
      required:
        - accountId
        - transactions
      properties:
        accountId:
          type: string
          format: uuid
        transactions:
          type: array
          items:
            $ref: "#/components/schemas/ImportTransaction"

    BulkCategorizeRequest:
      type: object
      required:
        - transactionIds
        - categoryId
      properties:
        transactionIds:
          type: array
          items:
            type: string
            format: uuid
        categoryId:
          type: string
          format: uuid

    BulkUpdatePayeeRequest:
      type: object
      required:
        - transactionIds
        - payeeId
      properties:
        transactionIds:
          type: array
          items:
            type: string
            format: uuid
        payeeId:
          type: string
          format: uuid

    BulkBillingCycleRequest:
      type: object
      required:
        - transactionIds
        - billingCycleId
      properties:
        transactionIds:
          type: array
          items:
            type: string
            format: uuid
        billingCycleId:
          type: string
          format: uuid

    BulkDeleteTransactionsRequest:
      type: object
      required:
        - transactionIds
      properties:
        transactionIds:
          type: array
          items:
            type: string
            format: uuid

    CreatePayeeRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        accountId:
          type: string
          format: uuid

    CreateRuleRequest:
      type: object
      required:
        - pattern
        - categoryId
      properties:
        pattern:
          type: string
        matchType:
          type: string
          enum: [contains, starts_with, exact]
          default: contains
        categoryId:
          type: string
          format: uuid
        payeeId:
          type: string
          format: uuid
        priority:
          type: integer

    UpdateRuleRequest:
      type: object
      properties:
