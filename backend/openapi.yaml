  # ============= Recurring Series =============
  # A recurring series is a user-defined expectation of a repeating charge or
  # income. FinTrak only forecasts the schedule and suggests matching
  # transactions; it never auto-creates transactions from a series and never
  # auto-links transactions to it. Linking is explicit via /recurring/attach.
  /recurring:
    get:
      tags:
        - Recurring
      summary: List recurring series
      operationId: getRecurringSeries
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Recurring series with derived next-due date and monthly amount
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/RecurringSeries"
        "401":
