        matchType:
          type: string
          enum: [contains, starts_with, exact]
        categoryId:
          type: string
          format: uuid
        categoryName:
          type: string
        payeeId:
          type: string
          format: uuid
        payee:
          type: string
        priority:
          type: integer

    Link:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [transfer, cashback, refund, bill_payment]
        fromTxnId:
