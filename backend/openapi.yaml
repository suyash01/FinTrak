        index:
          type: integer
        exists:
          type: boolean
        date:
          type: string
          format: date
        description:
          type: string
        amount:
          type: number
        type:
          type: string
          enum: [debit, credit]

    ValidateTransactionsResponse:
      type: object
      properties:
        total:
          type: integer
        existingCount:
          type: integer
        missingCount:
          type: integer
        results:
          type: array
          items:
            $ref: "#/components/schemas/ValidateTransactionResult"

    ParseStatementResult:
      type: object
      properties:
        transactions:
          type: array
          items:
            $ref: "#/components/schemas/ParseStatementTransaction"
        summary:
          type: object
          additionalProperties:
            type: string
        pageCount:
          type: integer
        transactionCount:
          type: integer

    TransferSuggestion:
      type: object
      properties:
        debitTxn:
          $ref: "#/components/schemas/Transaction"
        creditTxn:
          $ref: "#/components/schemas/Transaction"
        score:
          type: number

    CategorySpend:
      type: object
      properties:
        categoryId:
          type: string
          format: uuid
        categoryName:
          type: string
        categoryColor:
          type: string
        categoryIcon:
          type: string
        total:
          type: number
