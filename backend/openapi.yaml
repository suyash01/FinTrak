          type: string
        count:
          type: integer

    CreatePayeeRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        accountId:
          type: string
          format: uuid

    CreateRuleRequest:
      type: object
      required:
        - pattern
        - categoryId
      properties:
        pattern:
          type: string
        matchType:
          type: string
          enum: [contains, starts_with, exact]
          default: contains
        categoryId:
          type: string
          format: uuid
        payeeId:
          type: string
          format: uuid
        priority:
          type: integer
        accountId:
          type: string
          format: uuid
          description: Condition - only match transactions on this account.
        filterCategoryId:
          type: string
          format: uuid
          description: Condition - only match transactions with this category.
        filterPayeeId:
          type: string
          format: uuid
          description: Condition - only match transactions with this payee.
        minAmount:
          type: number
          description: Condition - minimum amount (major units).
        maxAmount:
          type: number
          description: Condition - maximum amount (major units).
        txnType:
          type: string
          enum: [debit, credit]
          description: Condition - only match this transaction type.
        dateFrom:
          type: string
          format: date
          description: Condition - inclusive lower date bound.
        dateTo:
          type: string
          format: date
          description: Condition - inclusive upper date bound.
        isLinked:
          type: boolean
          description: Condition - match only linked (true) or unlinked (false).
        isRecurring:
          type: boolean
          description: Condition - match only recurring (true) or non-recurring (false).
        addTags:
          type: array
          items:
            type: string
          description: Action - tags to add to matching transactions.
        notes:
          type: string
          description: Action - note text appended to matching transactions.

    UpdateRuleRequest:
      type: object
      properties:
        pattern:
          type: string
        matchType:
          type: string
          enum: [contains, starts_with, exact]
        categoryId:
          type: string
          format: uuid
        payeeId:
          type: string
          format: uuid
        priority:
          type: integer
        accountId:
          type: string
          format: uuid
        filterCategoryId:
          type: string
          format: uuid
        filterPayeeId:
          type: string
          format: uuid
        minAmount:
          type: number
        maxAmount:
          type: number
        txnType:
          type: string
          enum: [debit, credit]
        dateFrom:
          type: string
          format: date
        dateTo:
          type: string
          format: date
        isLinked:
          type: boolean
        isRecurring:
          type: boolean
        addTags:
          type: array
          items:
            type: string
        notes:
          type: string

    CreateLinkRequest:
      type: object
      required:
        - type
