openapi: 3.0.3
info:
  title: FinTrak
  description: |
    Personal finance tracker API. All API endpoints are prefixed with `/api/v1`.

    ## Authentication
    `/auth/register` and `/auth/login` authenticate the user and set the JWT as
    an httpOnly, `SameSite=Lax` session cookie (`fintrak_token`); the token is
    never returned in the response body. Browsers send that cookie
    automatically, which is how the SPA authenticates.

    For non-browser clients, protected routes also accept a Bearer token in the
    `Authorization` header, using the value from the session cookie:
    ```
    Authorization: Bearer <token>
    ```
  version: 0.1.0-alpha.0
  contact:
    name: FinTrak
  license:
    name: AGPL v3.0

servers:
  - url: http://localhost:8080/api/v1
    description: Development server

paths:
  /health:
    get:
      tags:
        - System
      summary: Health check
      description: Returns the health status of the API
      operationId: getHealth
      responses:
        "200":
          description: API is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /openapi.yaml:
    get:
      tags:
        - System
      summary: Get the OpenAPI contract
      description: Returns this document as YAML.
      operationId: getOpenApiSpec
      responses:
        "200":
          description: The OpenAPI document.
          content:
            application/yaml:
              schema:
                type: string

  # ============= Authentication =============
  /auth/register:
    post:
      tags:
        - Authentication
      summary: Register a new user
      description: Create a new user account. The JWT is set as an httpOnly session cookie, not returned in the body.
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: An account with this email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /auth/login:
    post:
      tags:
        - Authentication
      summary: Login a user
      description: Authenticate a user. The JWT is set as an httpOnly session cookie, not returned in the body.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /auth/logout:
    post:
      tags:
        - Authentication
      summary: Log out
      description: Clears the session cookie.
      operationId: logout
      responses:
        "200":
          description: Logged out
        "500":
          $ref: "#/components/responses/InternalServerError"

  /auth/me:
    get:
      tags:
        - Authentication
      summary: Get the current user
      description: Returns the authenticated user for the current session cookie.
      operationId: getMe
      security:
        - BearerAuth: []
      responses:
        "200":
          description: The current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ============= Accounts =============
  /accounts:
    get:
      tags:
        - Accounts
      summary: List all accounts
      description: Get all accounts belonging to the authenticated user
      operationId: getAccounts
      security:
        - BearerAuth: []
      responses:
        "200":
          description: List of accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

    post:
      tags:
        - Accounts
      summary: Create a new account
      description: Create a new bank or credit-card account
      operationId: createAccount
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccountRequest"
      responses:
        "201":
          description: Account created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /accounts/{id}:
    put:
      tags:
        - Accounts
      summary: Update an account
      description: Update account details (name, type, bank, currency, color, default status)
      operationId: updateAccount
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: Account ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAccountRequest"
      responses:
        "200":
          description: Account updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

    delete:
      tags:
        - Accounts
      summary: Delete an account
      description: Delete an account and its associated payee
      operationId: deleteAccount
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: Account ID
      responses:
        "200":
          description: Account deleted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /accounts/{id}/export:
    get:
      tags:
        - Accounts
      summary: Export account transactions as CSV
      description: Download all transactions for an account as a CSV file
      operationId: exportAccount
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: Account ID
      responses:
        "200":
          description: CSV file
          content:
            text/csv:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /accounts/{id}/billing-cycles:
    get:
      tags:
        - Accounts
      summary: Get billing cycles for a credit card account
      description: List all billing cycles for a credit-card account with transaction counts and outstanding totals. Cycles are auto-generated one per month, ending on the account's billingDay. totalOutstanding is the account's running balance at the cycle's end date (all debits minus all credits — purchases, payments, refunds, cashbacks — posted up to that date). Non-credit-card accounts return an empty list.
      operationId: getBillingCycles
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: Account ID
      responses:
        "200":
          description: Billing cycles
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/BillingCycle"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # ============= Account Types =============
  /account-types:
    get:
      tags:
        - Account Types
      summary: List account types
      description: Get all available account types (e.g., bank, credit_card)
      operationId: getAccountTypes
      security:
        - BearerAuth: []
      responses:
        "200":
          description: List of account types
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AccountType"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

    post:
      tags:
        - Account Types
      summary: Create a new account type
      description: Create a new custom account type (admin only)
      operationId: createAccountType
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccountTypeRequest"
      responses:
        "201":
          description: Account type created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountType"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /account-types/{id}:
    put:
      tags:
        - Account Types
      summary: Update an account type
      description: Update a custom account type (admin only)
      operationId: updateAccountType
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Account type ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAccountTypeRequest"
      responses:
        "200":
          description: Account type updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountType"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

    delete:
      tags:
        - Account Types
      summary: Delete an account type
      description: Delete a custom account type (admin only)
      operationId: deleteAccountType
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Account type ID
      responses:
        "200":
          description: Account type deleted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Account type is in use by existing accounts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # ============= Transactions =============
  /transactions:
    get:
      tags:
        - Transactions
      summary: List transactions
      description: Get transactions with optional filtering, sorting, and pagination
      operationId: getTransactions
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: accountId
          schema:
            type: string
            format: uuid
          description: Filter by account ID
        - in: query
          name: categoryId
          schema:
            type: string
            format: uuid
          description: Filter by category ID
        - in: query
          name: payeeId
          schema:
            type: string
            format: uuid
          description: Filter by payee ID
        - in: query
          name: search
          schema:
            type: string
          description: Search in description (case-insensitive)
        - in: query
          name: dateFrom
          schema:
            type: string
            format: date
          description: Filter transactions from this date (YYYY-MM-DD)
        - in: query
          name: dateTo
          schema:
            type: string
            format: date
          description: Filter transactions until this date (YYYY-MM-DD)
        - in: query
          name: type
          schema:
            type: string
            enum: [debit, credit]
          description: Filter by transaction type
        - in: query
          name: amount
          schema:
            type: number
          description: Filter by exact amount
        - in: query
          name: uncategorized
          schema:
            type: string
            enum: ["true", "false"]
          description: Filter for uncategorized transactions only
        - in: query
          name: linked
          schema:
            type: string
            enum: ["true", "false"]
          description: Filter by link status
        - in: query
          name: recurringId
          schema:
            type: string
            format: uuid
          description: Only transactions linked to this recurring series
        - in: query
          name: recurring
          schema:
            type: string
            enum: [linked, unlinked]
          description: Filter by whether the transaction is linked to any recurring series
        - in: query
          name: sortBy
          schema:
            type: string
            enum: [date, amount, createdAt]
            default: date
          description: Sort column
        - in: query
          name: sortOrder
          schema:
            type: string
            enum: [ASC, DESC]
            default: DESC
          description: Sort direction
        - in: query
          name: page
          schema:
            type: integer
            default: 1
            minimum: 1
          description: Page number (1-indexed)
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
          description: Items per page (0 = no pagination, return all)
      responses:
        "200":
          description: List of transactions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

    post:
      tags:
        - Transactions
      summary: Create a new transaction
      operationId: createTransaction
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTransactionRequest"
      responses:
        "201":
          description: Transaction created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /transactions/{id}:
    patch:
      tags:
        - Transactions
      summary: Update a transaction
      description: Update transaction fields (category, tags, notes, payee, date, description, amount, type, billing cycle)
      operationId: updateTransaction
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: Transaction ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTransactionRequest"
      responses:
        "200":
          description: Transaction updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

    delete:
      tags:
        - Transactions
      summary: Delete a transaction
      operationId: deleteTransaction
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: Transaction ID
      responses:
        "200":
          description: Transaction deleted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /transactions/import:
    post:
      tags:
        - Transactions
      summary: Import transactions
      description: Import a batch of transactions into an account with optional duplicate detection
      operationId: importTransactions
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportRequest"
      responses:
        "200":
          description: Import completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /transactions/validate:
    post:
      tags:
        - Transactions
      summary: Validate transactions
      description: Check which transactions would be considered duplicates without importing them
      operationId: validateTransactions
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidateTransactionsRequest"
      responses:
        "200":
          description: Validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidateTransactionsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /transactions/bulk-categorize:
    post:
      tags:
        - Transactions
      summary: Bulk categorize transactions
      operationId: bulkCategorize
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkCategorizeRequest"
      responses:
        "200":
          description: Categorization completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated:
                    type: integer
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /transactions/bulk-payee:
    post:
      tags:
        - Transactions
      summary: Bulk update payees
      operationId: bulkUpdatePayee
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkUpdatePayeeRequest"
      responses:
        "200":
          description: Update completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated:
                    type: integer
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /transactions/bulk-billing-cycle:
    post:
      tags:
        - Transactions
      summary: Bulk update billing cycles
      operationId: bulkUpdateBillingCycle
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkBillingCycleRequest"
      responses:
        "200":
          description: Update completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated:
                    type: integer
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /transactions/bulk-loan:
    post:
      tags:
        - Transactions
      summary: Attach transactions to a Loan / EMI account, or detach them
      description: >
        Attaches the given transactions as EMI payments to a single Loan / EMI
        account (loanAccountId set) or detaches them from whatever loan account
        they are currently attached to (loanAccountId omitted/null). A
        transaction can be attached to at most one loan account; already-linked
        transactions must be detached first (409). Attaching also sets each
        transaction's payee to the loan account's linked payee, so EMI payments read
        as paid to the loan. Detaching leaves payees unchanged.
      operationId: bulkLinkLoan
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkLoanRequest"
      responses:
        "200":
          description: Linking completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  attached:
                    type: integer
                  detached:
                    type: integer
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: One or more transactions are already linked to a loan account
        "500":
          $ref: "#/components/responses/InternalServerError"

  /transactions/bulk-delete:
    post:
      tags:
        - Transactions
      summary: Bulk delete transactions
      operationId: bulkDeleteTransactions
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkDeleteTransactionsRequest"
      responses:
        "200":
          description: Deletion completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: integer
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # ============= Categories =============
  # ============= Category Groups =============
  /groups:
    get:
      tags:
        - Categories
      summary: List category groups
      description: The immutable base groups plus the user's custom groups.
      operationId: getGroups
      security:
        - BearerAuth: []
      responses:
        "200":
          description: List of groups
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    name: { type: string }
                    icon: { type: string }
                    color: { type: string }
                    isBase: { type: boolean }
                    isGlobal: { type: boolean }
                    sortOrder: { type: integer }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

    post:
      tags:
        - Categories
      summary: Create a custom group
      operationId: createGroup
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, name]
              properties:
                id: { type: string }
                name: { type: string }
                icon: { type: string }
                color: { type: string }
      responses:
        "201":
          description: Group created
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /groups/{id}:
    put:
      tags:
        - Categories
      summary: Update a custom group
      operationId: updateGroup
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
