      properties:
        id:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
        date:
          type: string
          format: date
        description:
          type: string
        amount:
          type: number
        type:
          type: string
          enum: [debit, credit]
        categoryId:
          type: string
          format: uuid
          nullable: true
        tags:
          type: array
          items:
            type: string
        notes:
          type: string
        payeeId:
          type: string
          format: uuid
          nullable: true
        billingCycleId:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    BackupLink:
      type: object
      required: [id, type, fromTxnId, toTxnId]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [transfer, cashback, refund, bill_payment]
        fromTxnId:
          type: string
          format: uuid
        toTxnId:
          type: string
          format: uuid
        notes:
          type: string
        createdAt:
