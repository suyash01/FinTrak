          type: string
          format: uuid
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        label:
          type: string
        totalOutstanding:
          type: number
          format: double
          description: Running balance at the cycle's end date — all debits minus all credits (purchases, payments, refunds, cashbacks) posted up to that date.
        transactionCount:
          type: integer

    PaperlessDocument:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        correspondent:
          type: string
        documentType:
          type: string
        created:
          type: string
