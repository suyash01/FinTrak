                $ref: "#/components/schemas/Rule"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /rules/{id}:
    put:
      tags:
        - Rules
      summary: Update a rule
      operationId: updateRule
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
