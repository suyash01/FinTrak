        accountName:
          type: string
        date:
          type: string
          format: date-time
        description:
          type: string
        amount:
          type: number
          format: double
        type:
          type: string
          enum: [debit, credit]
        categoryId:
          type: string
          format: uuid
        categoryName:
          type: string
        categoryIcon:
          type: string
        categoryColor:
          type: string
        payeeId:
          type: string
          format: uuid
        payee:
          type: string
        tags:
          type: array
          items:
            type: string
        notes:
          type: string
        isLinked:
          type: boolean
        linkCount:
          type: integer
        linkId:
          type: string
          format: uuid
        billingCycleId:
          type: string
          format: uuid
        billingCycleLabel:
          type: string
        loanAccountId:
          type: string
          format: uuid
          description: Loan / EMI account this transaction is attached to as an EMI payment
        loanAccountName:
          type: string
        recurringSeriesId:
          type: string
          format: uuid
          description: Recurring subscription this transaction is linked to
        recurringSeriesName:
          type: string
        createdAt:
          type: string
          format: date-time
        isSummary:
          type: boolean

    TransactionListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Transaction"
        total:
          type: integer
        page:
          type: integer
        limit:
