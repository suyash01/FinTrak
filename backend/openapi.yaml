          enum: [transfer, cashback, refund, bill_payment]
        fromTxnId:
          type: string
          format: uuid
        toTxnId:
          type: string
          format: uuid
        notes:
          type: string

    BulkCreateLinksRequest:
      type: object
      required:
        - links
      properties:
        links:
          type: array
          items:
            $ref: "#/components/schemas/CreateLinkRequest"

    BulkDeleteLinksRequest:
      type: object
      required:
        - ids
